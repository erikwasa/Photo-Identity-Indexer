<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#162a2d" />
    <meta name="description" content="Local-first face review for Photo Identity Indexer." />
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PhotoIdentity.Web.styles.css" />
    <link rel="stylesheet" href="css/detector-comparison-workspace.css?v=1" />
    <title>Photo Identity</title>
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <div class="spinner" aria-hidden="true"></div>
            <p>Starting local review…</p>
        </div>
    </div>
    <div id="blazor-error-ui" hidden>
        The review application encountered an error.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">×</button>
    </div>
    <script src="detector-evaluation.js?v=3"></script>
    <script src="js/dismissible-menus.js?v=1"></script>
    <script src="js/native-person-selects.js?v=1"></script>
    <script src="js/slideshow.js?v=2"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
        }
    </script>
</body>
</html>
