blocker_notes:
- WI-0098 completed on 2026-09-02; PostgreSQL foundational schema and neutral persistence contracts are available for migration slices.
- Includes the 2026-09-01 hosted-service shutdown class where a SQLite table lock escaped ArchiveAdvancementHostedService recovery handling.
- 'PR #245 merged and workflow #1437 passed. Maintainer live verification then passed on the existing Podman 5.8.x volume: authenticated container SQL, Windows localhost protocol, and the isolated PostgreSQL persistence test all succeeded with schema version 3.'
- 'PR #246 merged at 740dfd9684dc83ac77728beec206dc5950fac49a and workflow #1441 passed. Maintainer live verification then passed again on the existing volume, accepting PostgreSQL schema version 4 and archive-availability persistence.'
- 'PR #247 merged and workflow #1444 passed, but maintainer live verification exposed an invalid test chronology: the isolated fixture seeded asset creation with the current clock and then used an earlier fixed source-observation timestamp, correctly violating the foundational last_seen_at_utc >= created_at_utc constraint.'
- 'PR #248 corrected only the live-test chronology. Workflow #1448 passed and maintainer live verification then passed end-to-end on the existing Podman volume, accepting PostgreSQL schema version 5 and source-observation/verification persistence.'
- 'PR #249 merged at b8c598d3a3a6aa8e48cae89cb99a7f2e12b59845. Maintainer live verification then passed on the existing Podman volume, accepting PostgreSQL schema version 6 and archive-coverage persistence.'
- 'PR #250 merged at 0085146e1b3981c240c2b3aa7d85feb6e990e4fb and workflow #1454 passed. Maintainer live verification then exposed only a test expectation mismatch: PostgreSQL jsonb normalized checkpoint JSON whitespace.'
- 'PR #251 corrected only the checkpoint test to compare JSON structurally. Workflow #1458 passed and maintainer live verification then passed end-to-end, accepting the PostgreSQL durable-processing repository against schema version 6.'
- 'PR #252 merged at 8b503dade560ca3a4356e06a36a4c51c6ea65378 and workflow #1462 passed. Maintainer live verification then passed, accepting PostgreSQL schema version 7 and archive advancement-control persistence.'
- 'PR #253 merged at 034670377f12439531cb15b6382c2d09d619b4d4 and workflow #1465 passed. Maintainer live verification then passed, accepting PostgreSQL schema version 8 plus review-proxy completion and post-analysis retry persistence.'
- 'PR #254 initially failed workflow #1469 on one C# local-variable scoping error. The corrective commit changed only local names; workflow #1470 passed, PR #254 merged at 65347049842db70cbed9a12f4637b582e819a4ac, and maintainer PostgreSQL review/verification succeeded, accepting schema version 9 and managed hydration ownership semantics.'
- 'PR #255 merged at 865cfe01ab6d67216d3719814f7b9ab0fe782ce4 and workflow #1475 passed. Maintainer review/verification succeeded, accepting the PostgreSQL storage-accounting adapter against schema version 9.'
- 'PR #256 merged at c77fc49eddd636fe54e02745a73441bdb4939d96 and workflow #1479 passed. Maintainer review/verification succeeded, accepting PostgreSQL schema version 10 plus capture/GPS and GeoNames operational state.'
- Final WI-0099 audit found no remaining unimplemented persistence surface owned by WI-0099. Remaining direct SQLite runtime composition belongs to WI-0101 normal-runtime SQLite elimination and WI-0102 controlled provider cutover.
- 'PR #257 merged at 3431cf8ed3f2dff435d6f7d7a452c219d5c53708, workflow #1484 passed, and the maintainer post-merge verify-postgres.ps1 run succeeded. Concurrent advancement/enrichment/availability writes are accepted and WI-0099 is complete.'
