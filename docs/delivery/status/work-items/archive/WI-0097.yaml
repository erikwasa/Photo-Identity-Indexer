blocker_notes:
- PostgreSQL is the accepted long-term authoritative catalogue per ADR-0009; comparative SQLite/PostgreSQL benchmarking is not required.
- Maintainer verification after PR
- Windows forwarding became reachable after PR
- After PR
- Maintainer verification after PR
- Upstream Podman issue
- 'Maintainer confirmed both Windows client and Linux server were Podman 6.0.2 (commit b28edb9ad70ce4317dc762ee9ce0a6d081d154e9), matching the upstream regression report exactly. The runtime has now been downgraded/recreated to the accepted 5.8.x baseline: client 5.8.5 (6d48b6f12f793176f3f6bc808b5a440984c14eb2), server 5.8.6 (a859fc66702c23e869c282c63e92d9b6cd264229). Next step is rerun live verification.'
- On the 5.8.x baseline, authenticated in-container SQL and the Windows localhost PostgreSQL protocol preflight both pass. A verifier-only PowerShell bug then captured dotnet test output together with the exit code, causing a false generic failure; the active slice returns only the numeric test exit code.
- 'Final maintainer verification passed on 2026-09-02: verify-postgres.ps1 completed the isolated migration bootstrap successfully; current main /health reported catalogueProvider=sqlite and PostgreSQL configured=true, status=ready, schemaVersion=1 while the real SQLite catalogue remained at schemaVersion=16.'
