- type: maintainer-acceptance
  value: '2026-10-30 Europe/Stockholm: maintainer reported PASS focused .NET tests, docs validate/generate, four synthetic 720p/540p landscape/portrait with optional audio, temporary cleanup, Settings persistence, single-video-step Archive, seeking/orientation/audio, same revision/preset reuse, immutable original hashes and isolated PostgreSQL quota/retention tests. Three already-local MOV/MP4 proxies were successful with anonymous 14.36->0.07 MiB (540p, 99.5%), 2.36->1.53 MiB (720p, 35.3%), 20.68->0.74 MiB (720p, 96.4%). Qualitative performance acceptable and 540p perceived quality sufficient. Zero online-only hydrations. No destructive removal from personal cache. Differences between real 720p and 540p sources prevent matched A/B; numeric real encode times not measured; default stays 720p, compact is opt-in. Only registered-byte quota, not strict physical disk bound. OneDrive hydration/release WI-0207, browser streaming WI-0152, manual eviction sufficient.'
