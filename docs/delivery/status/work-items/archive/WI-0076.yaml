blocker_notes:
- Measurement identified repeated per-image model-session initialization as the dominant local cost. PRs #210 and #211 established diagnostics and fixed online-only derivative liveness; PR #212 implemented safe session reuse.
- Maintainer benchmark evidence showed the local scenario improve from about 359 images/hour to about 1,925 images/hour with one model initialization plus 154 reuses. The online-only scenario also completed cleanly with bounded hydration/release.
- Lower-value hash-read, prefetch and loop-delay ideas remain optional future optimizations rather than M20 completion blockers. M24/WI-0106 subsequently demonstrated sustained production catch-up and incremental operation on the real archive.
