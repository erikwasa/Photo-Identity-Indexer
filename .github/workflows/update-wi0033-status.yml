name: update-wi0033-status

on:
  push:
    branches:
      - agent/WI-0033-queue-navigation

permissions:
  contents: write

jobs:
  update-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Mark WI-0033 in progress
        shell: pwsh
        run: |
          $path = "docs/delivery/status/work-items.yaml"
          $content = Get-Content $path -Raw
          $old = @"
            - id: WI-0033
              title: Accelerate the human review workflow
              milestone: M06
              status: ready
              owner: ai-agent
              document: ../work-items/WI-0033-review-throughput.md
              last_updated_at: '2026-07-30'
              blockers:
                - WI-0027
                - WI-0029
              evidence: []
          "@.Replace("          ", "")
          $new = @"
            - id: WI-0033
              title: Accelerate the human review workflow
              milestone: M06
              status: in_progress
              owner: ai-agent
              document: ../work-items/WI-0033-review-throughput.md
              started_at: '2026-07-30'
              last_updated_at: '2026-07-30'
              branch: agent/WI-0033-queue-navigation
              blockers:
                - WI-0027
                - WI-0029
              evidence: []
          "@.Replace("          ", "")
          if (-not $content.Contains($old)) {
              throw "WI-0033 ready registry block was not found."
          }
          [System.IO.File]::WriteAllText($path, $content.Replace($old, $new), [System.Text.UTF8Encoding]::new($false))

      - name: Generate delivery status
        shell: pwsh
        run: dotnet run --project tools/PhotoIdentity.Docs -- generate

      - name: Validate delivery status
        shell: pwsh
        run: |
          dotnet run --project tools/PhotoIdentity.Docs -- validate
          dotnet run --project tools/PhotoIdentity.Docs -- generate --check

      - name: Commit generated status
        shell: pwsh
        run: |
          git rm .github/workflows/update-wi0033-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/delivery/status/work-items.yaml docs/delivery/status/milestones.yaml docs/delivery/status/current.md docs/delivery/roadmap.md
          git commit -m "Start WI-0033 queue navigation"
          git push origin HEAD:agent/WI-0033-queue-navigation
