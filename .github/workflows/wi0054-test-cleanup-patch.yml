name: WI-0054 test cleanup patch

on:
  push:
    branches:
      - agent/WI-0054-archive-ui-polish
    paths:
      - .github/workflows/wi0054-test-cleanup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0054-archive-ui-polish
          fetch-depth: 0
      - name: Clear SQLite pools before temp cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/PhotoIdentity.Integration.Tests/CollectionViewerPreviewApplicationTests.cs')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = '    private static void DeleteTemporaryDirectory(string directory)'
          index = lines.index(marker)
          brace = index + 1
          if lines[brace].strip() != '{':
              raise SystemExit('Unexpected cleanup method shape.')
          insertion = '        SqliteConnection.ClearAllPools();'
          if insertion not in lines[index:index + 5]:
              lines.insert(brace + 1, insertion)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/wi0054-test-cleanup-patch.yml
          git config user.name "Erik Wahlström"
          git config user.email "54457926+erikwasa@users.noreply.github.com"
          git add tests/PhotoIdentity.Integration.Tests/CollectionViewerPreviewApplicationTests.cs
          git commit -m "Fix WI-0054 test cleanup"
          git push origin HEAD:agent/WI-0054-archive-ui-polish
