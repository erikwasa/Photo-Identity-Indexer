name: WI-0109 migration artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate-work-item-status:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/WI-0109-repository-cutover'
    runs-on: windows-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore documentation tool
        run: dotnet restore tools/PhotoIdentity.Docs/PhotoIdentity.Docs.csproj

      - name: Mark WI-0109 active in migration source
        run: dotnet run --project tools/PhotoIdentity.Docs -- start WI-0109 --owner ai-agent --branch agent/WI-0109-repository-cutover

      - name: Migrate canonical work-item shards
        run: dotnet run --project tools/PhotoIdentity.Docs -- migrate-work-items

      - name: Generate bounded compatibility views
        run: dotnet run --project tools/PhotoIdentity.Docs -- generate

      - name: Validate migrated documentation
        shell: pwsh
        run: |
          dotnet run --project tools/PhotoIdentity.Docs -- validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/PhotoIdentity.Docs -- generate --check
          exit $LASTEXITCODE

      - name: Upload canonical migration output
        uses: actions/upload-artifact@v4
        with:
          name: wi0109-canonical-work-items
          path: |
            docs/delivery/status/work-items/
            docs/delivery/status/work-items.yaml
            docs/delivery/status/work-items-index.md
            docs/delivery/status/milestones.yaml
            docs/delivery/roadmap.md
          retention-days: 1
