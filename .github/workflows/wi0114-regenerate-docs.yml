name: WI-0114 regenerate docs

on:
  push:
    branches:
      - agent/WI-0114-postgres-readlatest-fix

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/WI-0114-postgres-readlatest-fix
          persist-credentials: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Regenerate governed documentation
        run: dotnet run --project tools/PhotoIdentity.Docs -- generate

      - name: Commit generated output and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wi0114-regenerate-docs.yml
          git add docs/delivery/status/work-items.yaml docs/delivery/status/work-items-index.md docs/delivery/status/milestones.yaml docs/delivery/roadmap.md
          if git diff --cached --quiet; then
            echo "No generated documentation changes were required."
            exit 0
          fi
          git commit -m "Regenerate WI-0114 status views"
          git push origin HEAD:agent/WI-0114-postgres-readlatest-fix
