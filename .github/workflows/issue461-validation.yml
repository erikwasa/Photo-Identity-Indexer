name: issue461-validation
on:
  push:
    branches: [agent/issue-461-landscape-verification]
permissions:
  contents: write
jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render shell across portrait and landscape widths
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/layout" playwright
          "$RUNNER_TEMP/layout/node_modules/.bin/playwright" install --with-deps chromium
          cat > "$RUNNER_TEMP/layout/check.cjs" <<'JS'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const path = 'src/PhotoIdentity.Web/Layout/MainLayout.razor.css';
            const css = fs.readFileSync(path, 'utf8');
            const old = cp.execFileSync('git', ['show', 'origin/main:' + path], { encoding: 'utf8' });
            const global = fs.readFileSync('src/PhotoIdentity.Web/wwwroot/css/app.css', 'utf8');
            const shell = fs.readFileSync('src/PhotoIdentity.Web/Layout/MainLayout.razor', 'utf8')
              .replace(/^@inherits.*$/m, '').replace('@AppSurfaceNavigation.SlideshowsPath', '/slideshows').replace('@Body', '<h1>Review workspace</h1>');
            await page.setViewportSize({ width: 900, height: 412 });
            await page.setContent(`<style>${global}\n${old}</style>${shell}`);
            const baseline = await page.evaluate(() => ({ viewport: innerWidth, document: document.documentElement.scrollWidth }));
            console.log('Before fix:', baseline);
            assert(baseline.document > baseline.viewport, 'Fixture must reproduce original landscape overflow');
            await page.setContent(`<style>${global}\n${css}</style>${shell}`);
            for (const width of [360, 412, 680, 740, 844, 900, 960, 1024, 1280, 412, 900, 360]) {
              await page.setViewportSize({ width, height: width > 680 ? 412 : 900 });
              for (const open of [false, true]) {
                await page.locator('.advanced-menu').evaluate((el, open) => el.open = open, open);
                const result = await page.evaluate(() => ({ viewport: innerWidth, document: document.documentElement.scrollWidth,
                  links: [...document.querySelectorAll('.primary-link, details[open] .advanced-menu-panel a')].map(el => ({ label: el.textContent.trim(), left: el.getBoundingClientRect().left, right: el.getBoundingClientRect().right })) }));
                console.log(JSON.stringify({width, open, ...result}));
                assert(result.document <= width, 'Document overflow');
                for (const link of result.links) assert(link.left >= 0 && link.right <= width, 'Link outside viewport: ' + link.label);
              }
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node "$RUNNER_TEMP/layout/check.cjs"
      - name: Record maintainer acceptance through lifecycle commands
        shell: bash
        run: |
          dotnet run --project tools/PhotoIdentity.Docs -- show WI-0176
          dotnet run --project tools/PhotoIdentity.Docs -- review WI-0163
          for id in WI-0163 WI-0167 WI-0169 WI-0170 WI-0172 WI-0173; do
            dotnet run --project tools/PhotoIdentity.Docs -- show "$id"
            dotnet run --project tools/PhotoIdentity.Docs -- complete "$id" --evidence-type maintainer-acceptance --evidence-value "2026-10-02 Europe/Stockholm: erikwasa confirms acceptance; see the Maintainer acceptance section in the work-item document. Numerical timing explicitly waived for WI-0169 and WI-0170." --verified-by erikwasa
          done
          dotnet run --project tools/PhotoIdentity.Docs -- review WI-0176
          dotnet run --project tools/PhotoIdentity.Docs -- generate
          dotnet run --project tools/PhotoIdentity.Docs -- validate
          dotnet run --project tools/PhotoIdentity.Docs -- generate --check
      - name: Save generated lifecycle and remove temporary validation workflow
        shell: bash
        run: |
          rm .github/workflows/issue461-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/delivery/status .github/workflows/issue461-validation.yml
          git commit -m "Record maintained acceptance and regenerate lifecycle views"
          git push
