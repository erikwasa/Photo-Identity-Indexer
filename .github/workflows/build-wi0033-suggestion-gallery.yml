name: build-wi0033-suggestion-gallery

on:
  push:
    branches:
      - agent/WI-0033-suggestion-gallery

permissions:
  contents: write

concurrency:
  group: wi0033-suggestion-gallery-builder
  cancel-in-progress: true

jobs:
  build-slice:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply suggestion gallery slice
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8", newline="\n")

          def replace(path, old, new):
              content = read(path)
              if old not in content:
                  raise RuntimeError(f"Expected text not found in {path}: {old[:120]!r}")
              write(path, content.replace(old, new, 1))

          records = "src/PhotoIdentity.Persistence.Sqlite/ReviewCatalogueRecords.cs"
          replace(records,
          '''public static class CatalogueReviewSorts
          {
              public const string CreatedDescending = "created-desc";
          }

          public sealed record CatalogueReviewPerson(PersonId Id, string DisplayName);
          ''',
          '''public static class CatalogueReviewSorts
          {
              public const string CreatedDescending = "created-desc";
              public const string SuggestedPerson = "suggested-person";
              public const string ScoreMarginDescending = "margin-desc";
              public const string ScoreMarginAscending = "margin-asc";
              public const string ScoreDescending = "score-desc";
              public const string NoSuggestionFirst = "no-suggestion-first";
          }

          public sealed record CatalogueReviewPerson(PersonId Id, string DisplayName);

          public sealed record CatalogueReviewTopSuggestion(
              long Id,
              CatalogueReviewPerson Person,
              ModelId ModelId,
              Sha256Digest ModelHash,
              int Rank,
              double Score,
              double? ScoreMargin,
              string Status,
              DateTimeOffset GeneratedAtUtc);
          ''')
          replace(records,
          '''    string State,
              CatalogueReviewPerson? Person,
              long? ActiveActionId);
          ''',
          '''    string State,
              CatalogueReviewPerson? Person,
              CatalogueReviewTopSuggestion? TopSuggestion,
              long? ActiveActionId);
          ''')

          repository = "src/PhotoIdentity.Persistence.Sqlite/SqliteReviewRepository.cs"
          replace(repository,
          '''            state,
                      person,
                      activeActionId);
          ''',
          '''            state,
                      person,
                      null,
                      activeActionId);
          ''')

          filtered = "src/PhotoIdentity.Persistence.Sqlite/SqliteReviewFilterRepository.cs"
          replace(filtered,
          '''        latest_observation AS (
                      SELECT
                          face_observations.*,
                          ROW_NUMBER() OVER (
                              PARTITION BY face_occurrence_id
                              ORDER BY observed_at_utc DESC, detector_model_id, detector_model_hash) AS row_number
                      FROM face_observations
                  )
                  """;
          ''',
          '''        latest_observation AS (
                      SELECT
                          face_observations.*,
                          ROW_NUMBER() OVER (
                              PARTITION BY face_occurrence_id
                              ORDER BY observed_at_utc DESC, detector_model_id, detector_model_hash) AS row_number
                      FROM face_observations
                  ),
                  top_suggestion AS (
                      SELECT
                          rankings.face_occurrence_id,
                          suggestions.id AS suggestion_id,
                          suggestions.suggested_person_id,
                          suggested_people.display_name,
                          rankings.model_id,
                          rankings.model_hash,
                          rankings.rank,
                          suggestions.score,
                          rankings.score_margin,
                          suggestions.status,
                          rankings.generated_at_utc
                      FROM identity_suggestion_rankings AS rankings
                      INNER JOIN identity_suggestions AS suggestions
                          ON suggestions.id = rankings.suggestion_id
                      INNER JOIN people AS suggested_people
                          ON suggested_people.id = suggestions.suggested_person_id
                         AND suggested_people.merged_into_person_id IS NULL
                      WHERE rankings.rank = 1
                        AND suggestions.status = 'pending'
                  )
                  """;
          ''')
          replace(filtered,
          '''        latest_action.person_id,
                  people.display_name
                  """;
          ''',
          '''        latest_action.person_id,
                  people.display_name,
                  top_suggestion.suggestion_id,
                  top_suggestion.suggested_person_id,
                  top_suggestion.display_name,
                  top_suggestion.model_id,
                  top_suggestion.model_hash,
                  top_suggestion.rank,
                  top_suggestion.score,
                  top_suggestion.score_margin,
                  top_suggestion.status,
                  top_suggestion.generated_at_utc
                  """;
          ''')
          replace(filtered,
          '''        LEFT JOIN people
                      ON people.id = latest_action.person_id
                  """;
          ''',
          '''        LEFT JOIN people
                      ON people.id = latest_action.person_id
                  LEFT JOIN top_suggestion
                      ON top_suggestion.face_occurrence_id = face_occurrences.id
                     AND top_suggestion.model_id = $model_id
                     AND top_suggestion.model_hash = $model_hash
                     AND $has_model = 1
                  """;
          ''')
          replace(filtered,
          '''        Sha256Digest? modelHash = null,
                  string sort = CatalogueReviewSorts.CreatedDescending,
                  CancellationToken cancellationToken = default)
          ''',
          '''        Sha256Digest? modelHash = null,
                  string sort = CatalogueReviewSorts.CreatedDescending,
                  bool includeWithoutSuggestion = false,
                  CancellationToken cancellationToken = default)
          ''')
          replace(filtered,
          '''        ValidateScope(modelId, modelHash);
                  string orderBy = SortExpression(sort);
                  string predicate = BuildPredicate(state, processingRunId, modelId, modelHash);
          ''',
          '''        ValidateScope(modelId, modelHash);
                  ValidateSortScope(modelId, modelHash, sort);
                  string orderBy = SortExpression(sort);
                  string predicate = BuildPredicate(
                      state,
                      processingRunId,
                      modelId,
                      modelHash,
                      includeWithoutSuggestion);
          ''')
          replace(filtered,
          '''        Sha256Digest? modelHash = null,
                  string sort = CatalogueReviewSorts.CreatedDescending,
                  CancellationToken cancellationToken = default)
              {
                  ValidateScope(modelId, modelHash);
                  string normalizedSort = NormalizeSort(sort);
          ''',
          '''        Sha256Digest? modelHash = null,
                  string sort = CatalogueReviewSorts.CreatedDescending,
                  bool includeWithoutSuggestion = false,
                  CancellationToken cancellationToken = default)
              {
                  ValidateScope(modelId, modelHash);
                  ValidateSortScope(modelId, modelHash, sort);
                  string normalizedSort = NormalizeSort(sort);
          ''')
          replace(filtered,
          '''        string predicate = BuildPredicate(state, processingRunId, modelId, modelHash);
          ''',
          '''        string predicate = BuildPredicate(
                      state,
                      processingRunId,
                      modelId,
                      modelHash,
                      includeWithoutSuggestion);
          ''')
          old_build_predicate = '''    private static string BuildPredicate(
                  string state,
                  ProcessingRunId? processingRunId,
                  ModelId? modelId,
                  Sha256Digest? modelHash)
              {
                  List<string> predicates = [StatePredicate(state)];
                  if (processingRunId is not null)
                  {
                      predicates.Add("""
                          EXISTS (
                              SELECT 1
                              FROM processing_jobs
                              WHERE processing_jobs.asset_revision_id = face_occurrences.asset_revision_id
                                AND processing_jobs.processing_run_id = $processing_run_id)
                          """);
                  }

                  if (modelId is not null && modelHash is not null)
                  {
                      predicates.Add("""
                          EXISTS (
                              SELECT 1
                              FROM identity_suggestion_rankings
                              WHERE identity_suggestion_rankings.face_occurrence_id = face_occurrences.id
                                AND identity_suggestion_rankings.model_id = $model_id
                                AND identity_suggestion_rankings.model_hash = $model_hash)
                          """);
                  }

                  return string.Join(" AND ", predicates.Select(value => $"({value})"));
              }
          '''
          new_build_predicate = '''    private static string BuildPredicate(
                  string state,
                  ProcessingRunId? processingRunId,
                  ModelId? modelId,
                  Sha256Digest? modelHash,
                  bool includeWithoutSuggestion)
              {
                  List<string> predicates = [StatePredicate(state)];
                  if (processingRunId is not null)
                  {
                      predicates.Add("""
                          EXISTS (
                              SELECT 1
                              FROM processing_jobs
                              WHERE processing_jobs.asset_revision_id = face_occurrences.asset_revision_id
                                AND processing_jobs.processing_run_id = $processing_run_id)
                          """);
                  }

                  if (modelId is not null && modelHash is not null && !includeWithoutSuggestion)
                  {
                      predicates.Add("""
                          EXISTS (
                              SELECT 1
                              FROM identity_suggestion_rankings
                              WHERE identity_suggestion_rankings.face_occurrence_id = face_occurrences.id
                                AND identity_suggestion_rankings.model_id = $model_id
                                AND identity_suggestion_rankings.model_hash = $model_hash)
                          """);
                  }

                  return string.Join(" AND ", predicates.Select(value => $"({value})"));
              }
          '''
          replace(filtered, old_build_predicate, new_build_predicate)
          old_parameters = '''    private static void AddScopeParameters(
                  SqliteCommand command,
                  ProcessingRunId? processingRunId,
                  ModelId? modelId,
                  Sha256Digest? modelHash)
              {
                  if (processingRunId is ProcessingRunId runId)
                  {
                      command.Parameters.AddWithValue("$processing_run_id", runId.ToString());
                  }

                  if (modelId is ModelId selectedModelId && modelHash is Sha256Digest selectedModelHash)
                  {
                      command.Parameters.AddWithValue("$model_id", selectedModelId.ToString());
                      command.Parameters.AddWithValue("$model_hash", selectedModelHash.ToString());
                  }
              }
          '''
          new_parameters = '''    private static void AddScopeParameters(
                  SqliteCommand command,
                  ProcessingRunId? processingRunId,
                  ModelId? modelId,
                  Sha256Digest? modelHash)
              {
                  if (processingRunId is ProcessingRunId runId)
                  {
                      command.Parameters.AddWithValue("$processing_run_id", runId.ToString());
                  }

                  bool hasModel = modelId is ModelId && modelHash is Sha256Digest;
                  command.Parameters.AddWithValue("$has_model", hasModel ? 1 : 0);
                  command.Parameters.AddWithValue("$model_id", hasModel ? modelId!.Value.ToString() : "");
                  command.Parameters.AddWithValue("$model_hash", hasModel ? modelHash!.Value.ToString() : "");
              }
          '''
          replace(filtered, old_parameters, new_parameters)
          replace(filtered,
          '''        return normalized switch
                  {
                      CatalogueReviewSorts.CreatedDescending => normalized,
                      _ => throw new ArgumentException($"Unsupported review sort '{sort}'.", nameof(sort)),
                  };
          ''',
          '''        return normalized switch
                  {
                      CatalogueReviewSorts.CreatedDescending => normalized,
                      CatalogueReviewSorts.SuggestedPerson => normalized,
                      CatalogueReviewSorts.ScoreMarginDescending => normalized,
                      CatalogueReviewSorts.ScoreMarginAscending => normalized,
                      CatalogueReviewSorts.ScoreDescending => normalized,
                      CatalogueReviewSorts.NoSuggestionFirst => normalized,
                      _ => throw new ArgumentException($"Unsupported review sort '{sort}'.", nameof(sort)),
                  };
          ''')
          replace(filtered,
          '''    private static string SortExpression(string sort) => NormalizeSort(sort) switch
              {
                  CatalogueReviewSorts.CreatedDescending =>
                      "face_occurrences.created_at_utc DESC, face_occurrences.id",
                  _ => throw new ArgumentOutOfRangeException(nameof(sort)),
              };
          ''',
          '''    private static string SortExpression(string sort) => NormalizeSort(sort) switch
              {
                  CatalogueReviewSorts.CreatedDescending =>
                      "face_occurrences.created_at_utc DESC, face_occurrences.id",
                  CatalogueReviewSorts.SuggestedPerson =>
                      "CASE WHEN top_suggestion.suggestion_id IS NULL THEN 1 ELSE 0 END, " +
                      "top_suggestion.display_name COLLATE NOCASE, top_suggestion.suggested_person_id, " +
                      "top_suggestion.score_margin DESC, top_suggestion.score DESC, " +
                      "face_occurrences.created_at_utc DESC, face_occurrences.id",
                  CatalogueReviewSorts.ScoreMarginDescending =>
                      "CASE WHEN top_suggestion.suggestion_id IS NULL THEN 1 ELSE 0 END, " +
                      "CASE WHEN top_suggestion.score_margin IS NULL THEN 1 ELSE 0 END, " +
                      "top_suggestion.score_margin DESC, top_suggestion.score DESC, " +
                      "face_occurrences.created_at_utc DESC, face_occurrences.id",
                  CatalogueReviewSorts.ScoreMarginAscending =>
                      "CASE WHEN top_suggestion.suggestion_id IS NULL THEN 1 ELSE 0 END, " +
                      "CASE WHEN top_suggestion.score_margin IS NULL THEN 1 ELSE 0 END, " +
                      "top_suggestion.score_margin, top_suggestion.score DESC, " +
                      "face_occurrences.created_at_utc DESC, face_occurrences.id",
                  CatalogueReviewSorts.ScoreDescending =>
                      "CASE WHEN top_suggestion.suggestion_id IS NULL THEN 1 ELSE 0 END, " +
                      "top_suggestion.score DESC, top_suggestion.score_margin DESC, " +
                      "face_occurrences.created_at_utc DESC, face_occurrences.id",
                  CatalogueReviewSorts.NoSuggestionFirst =>
                      "CASE WHEN top_suggestion.suggestion_id IS NULL THEN 0 ELSE 1 END, " +
                      "face_occurrences.created_at_utc DESC, face_occurrences.id",
                  _ => throw new ArgumentOutOfRangeException(nameof(sort)),
              };

              private static void ValidateSortScope(
                  ModelId? modelId,
                  Sha256Digest? modelHash,
                  string sort)
              {
                  string normalized = NormalizeSort(sort);
                  if (normalized != CatalogueReviewSorts.CreatedDescending &&
                      (modelId is null || modelHash is null))
                  {
                      throw new ArgumentException(
                          "Suggestion-aware review sorting requires an exact model ID and model hash.",
                          nameof(sort));
                  }
              }
          ''')
          old_read_face_start = read(filtered).index("    private static CatalogueReviewFace ReadFace")
          old_read_face_end = read(filtered).index("    private static DateTimeOffset Parse", old_read_face_start)
          content = read(filtered)
          new_read_face = '''    private static CatalogueReviewFace ReadFace(SqliteDataReader reader)
              {
                  string sourceKey = reader.GetString(3).Replace('\\\\', '/');
                  string photoName = Path.GetFileName(sourceKey);
                  long? activeActionId = reader.IsDBNull(10) ? null : reader.GetInt64(10);
                  string? actionKind = reader.IsDBNull(11) ? null : reader.GetString(11);
                  PersonId? personId = reader.IsDBNull(12)
                      ? null
                      : PersonId.From(Guid.Parse(reader.GetString(12)));
                  string? personName = reader.IsDBNull(13) ? null : reader.GetString(13);
                  CatalogueReviewPerson? person = personId is PersonId id && personName is not null
                      ? new CatalogueReviewPerson(id, personName)
                      : null;
                  CatalogueReviewTopSuggestion? topSuggestion = reader.IsDBNull(14)
                      ? null
                      : new CatalogueReviewTopSuggestion(
                          reader.GetInt64(14),
                          new CatalogueReviewPerson(
                              PersonId.From(Guid.Parse(reader.GetString(15))),
                              reader.GetString(16)),
                          new ModelId(reader.GetString(17)),
                          new Sha256Digest(reader.GetString(18)),
                          reader.GetInt32(19),
                          reader.GetDouble(20),
                          reader.IsDBNull(21) ? null : reader.GetDouble(21),
                          reader.GetString(22),
                          Parse(reader.GetString(23)));
                  string reviewState = actionKind switch
                  {
                      CatalogueReviewActionKinds.Assign => CatalogueReviewStates.Assigned,
                      CatalogueReviewActionKinds.Reject => CatalogueReviewStates.Rejected,
                      _ => CatalogueReviewStates.Unreviewed,
                  };

                  return new CatalogueReviewFace(
                      FaceOccurrenceId.From(Guid.Parse(reader.GetString(0))),
                      reader.GetInt32(1),
                      Parse(reader.GetString(2)),
                      string.IsNullOrWhiteSpace(photoName) ? "Photo" : photoName,
                      reader.GetString(4),
                      reader.IsDBNull(5) ? null : reader.GetInt32(5),
                      reader.IsDBNull(6) ? null : reader.GetInt32(6),
                      new Sha256Digest(reader.GetString(7)),
                      reader.IsDBNull(8) ? null : reader.GetString(8),
                      reader.IsDBNull(9) ? null : reader.GetDouble(9),
                      reviewState,
                      person,
                      topSuggestion,
                      activeActionId);
              }

          '''
          write(filtered, content[:old_read_face_start] + new_read_face + content[old_read_face_end:])

          contracts = "src/PhotoIdentity.Web/ReviewContracts.cs"
          replace(contracts,
          '''public sealed record ReviewPersonResponse(string Id, string DisplayName);

          public sealed record ReviewFaceResponse(
          ''',
          '''public sealed record ReviewPersonResponse(string Id, string DisplayName);

          public sealed record ReviewTopSuggestionResponse(
              long Id,
              ReviewPersonResponse Person,
              string ModelId,
              string ModelHash,
              int Rank,
              double Score,
              double? ScoreMargin,
              string Status,
              DateTimeOffset GeneratedAtUtc);

          public sealed record ReviewFaceResponse(
          ''')
          replace(contracts,
          '''    string State,
              ReviewPersonResponse? Person,
              DateTimeOffset CreatedAtUtc);
          ''',
          '''    string State,
              ReviewPersonResponse? Person,
              ReviewTopSuggestionResponse? TopSuggestion,
              DateTimeOffset CreatedAtUtc);
          ''')

          endpoints = "src/PhotoIdentity.Api/ReviewEndpoints.cs"
          replace(endpoints,
          '''        string? modelHash = null,
                  string sort = CatalogueReviewSorts.CreatedDescending,
                  CancellationToken cancellationToken = default)
          ''',
          '''        string? modelHash = null,
                  string sort = CatalogueReviewSorts.CreatedDescending,
                  bool includeWithoutSuggestion = false,
                  CancellationToken cancellationToken = default)
          ''')
          replace(endpoints,
          '''                parsedModelHash,
                          sort,
                          cancellationToken);
          ''',
          '''                parsedModelHash,
                          sort,
                          includeWithoutSuggestion,
                          cancellationToken);
          ''')
          replace(endpoints,
          '''        string? modelHash = null,
                  string sort = CatalogueReviewSorts.CreatedDescending,
                  CancellationToken cancellationToken = default)
              {
          ''',
          '''        string? modelHash = null,
                  string sort = CatalogueReviewSorts.CreatedDescending,
                  bool includeWithoutSuggestion = false,
                  CancellationToken cancellationToken = default)
              {
          ''')
          replace(endpoints,
          '''                parsedModelHash,
                          sort,
                          cancellationToken);
                      return Results.Ok(new ReviewFaceDetailsResponse(
          ''',
          '''                parsedModelHash,
                          sort,
                          includeWithoutSuggestion,
                          cancellationToken);
                      return Results.Ok(new ReviewFaceDetailsResponse(
          ''')
          replace(endpoints,
          '''        face.State,
                  face.Person is null ? null : ToResponse(face.Person),
                  face.CreatedAtUtc);

              private static ReviewPersonResponse ToResponse(CatalogueReviewPerson person) =>
          ''',
          '''        face.State,
                  face.Person is null ? null : ToResponse(face.Person),
                  face.TopSuggestion is null ? null : ToResponse(face.TopSuggestion),
                  face.CreatedAtUtc);

              private static ReviewTopSuggestionResponse ToResponse(CatalogueReviewTopSuggestion suggestion) => new(
                  suggestion.Id,
                  ToResponse(suggestion.Person),
                  suggestion.ModelId.ToString(),
                  suggestion.ModelHash.ToString(),
                  suggestion.Rank,
                  suggestion.Score,
                  suggestion.ScoreMargin,
                  suggestion.Status,
                  suggestion.GeneratedAtUtc);

              private static ReviewPersonResponse ToResponse(CatalogueReviewPerson person) =>
          ''')

          home = "src/PhotoIdentity.Web/Pages/Home.razor"
          replace(home,
          '''</nav>

          @if (!string.IsNullOrWhiteSpace(Error))
          ''',
          '''</nav>

          <section class="queue-controls" aria-labelledby="queue-controls-heading">
              <div class="section-heading">
                  <div>
                      <p class="eyebrow">Suggestion-aware review</p>
                      <h2 id="queue-controls-heading">Queue order</h2>
                  </div>
              </div>
              <div class="filter-grid">
                  <div>
                      <label class="field-label" for="queue-model">Suggestion model revision</label>
                      <select id="queue-model" @bind="SelectedModelIndex" @bind:after="ChangeModelAsync" disabled="@(Loading || Options.ModelRevisions.Count == 0)">
                          @if (Options.ModelRevisions.Count == 0)
                          {
                              <option value="">No ranked suggestions available</option>
                          }
                          else
                          {
                              @for (int index = 0; index < Options.ModelRevisions.Count; index++)
                              {
                                  ReviewModelRevisionFilterResponse model = Options.ModelRevisions[index];
                                  <option value="@index">@ModelLabel(model)</option>
                              }
                          }
                      </select>
                  </div>
                  <div>
                      <label class="field-label" for="queue-sort">Order</label>
                      <select id="queue-sort" @bind="Sort" @bind:after="ChangeSortAsync" disabled="@Loading">
                          @foreach ((string Value, string Label, bool RequiresModel) option in SortOptions)
                          {
                              <option value="@option.Value" disabled="@(option.RequiresModel && SelectedModel is null)">@option.Label</option>
                          }
                      </select>
                  </div>
              </div>
              @if (SelectedModel is ReviewModelRevisionFilterResponse activeModel)
              {
                  <dl class="active-scope queue-model-scope">
                      <div><dt>Model ID</dt><dd>@activeModel.ModelId</dd></div>
                      <div><dt>Exact model hash</dt><dd><code>@activeModel.ModelHash</code></dd></div>
                  </dl>
              }
          </section>

          @if (!string.IsNullOrWhiteSpace(Error))
          ''')
          replace(home,
          '''    private const string DefaultSort = "created-desc";

              private static readonly (string Value, string Label)[] Filters =
          ''',
          '''    private const string DefaultSort = "created-desc";

              private static readonly (string Value, string Label)[] Filters =
          ''')
          replace(home,
          '''    private static readonly (string Value, string Label)[] Filters =
              [
                  ("unreviewed", "Needs review"),
                  ("assigned", "Assigned"),
                  ("rejected", "Rejected"),
                  ("all", "All"),
              ];
          ''',
          '''    private static readonly (string Value, string Label)[] Filters =
              [
                  ("unreviewed", "Needs review"),
                  ("assigned", "Assigned"),
                  ("rejected", "Rejected"),
                  ("all", "All"),
              ];

              private static readonly (string Value, string Label, bool RequiresModel)[] SortOptions =
              [
                  ("created-desc", "Newest first", false),
                  ("suggested-person", "Suggested person", true),
                  ("margin-desc", "Easiest suggestions", true),
                  ("margin-asc", "Most ambiguous suggestions", true),
                  ("score-desc", "Highest score", true),
                  ("no-suggestion-first", "No suggestion first", true),
              ];
          ''')
          replace(home,
          '''    [Parameter, SupplyParameterFromQuery(Name = "sort")]
              public string Sort { get; set; } = DefaultSort;

              private ReviewFacePageResponse? Page { get; set; }
          ''',
          '''    [Parameter, SupplyParameterFromQuery(Name = "sort")]
              public string Sort { get; set; } = DefaultSort;

              [Parameter, SupplyParameterFromQuery(Name = "modelId")]
              public string ModelId { get; set; } = "";

              [Parameter, SupplyParameterFromQuery(Name = "modelHash")]
              public string ModelHash { get; set; } = "";

              private ReviewFilterOptionsResponse Options { get; set; } = new([], []);
              private ReviewFacePageResponse? Page { get; set; }
          ''')
          replace(home,
          '''    private string BulkNote { get; set; } = "";
              private bool Loading { get; set; }
          ''',
          '''    private string BulkNote { get; set; } = "";
              private string SelectedModelIndex { get; set; } = "";
              private bool Loading { get; set; }
          ''')
          replace(home,
          '''    private int SelectedCount => SelectedFaceIds.Count;
              private int PageUnreviewedCount => Page?.Items.Count(face => face.State == "unreviewed") ?? 0;
          ''',
          '''    private ReviewModelRevisionFilterResponse? SelectedModel =>
                  int.TryParse(SelectedModelIndex, out int modelIndex) &&
                  modelIndex >= 0 &&
                  modelIndex < Options.ModelRevisions.Count
                      ? Options.ModelRevisions[modelIndex]
                      : null;

              private int SelectedCount => SelectedFaceIds.Count;
              private int PageUnreviewedCount => Page?.Items.Count(face => face.State == "unreviewed") ?? 0;
          ''')
          replace(home,
          '''    protected override async Task OnInitializedAsync()
              {
                  State = Filters.Any(filter => filter.Value == State) ? State : "unreviewed";
                  Offset = Math.Max(0, Offset);
                  Sort = string.Equals(Sort, DefaultSort, StringComparison.Ordinal) ? Sort : DefaultSort;
                  await LoadPeopleAsync();
                  await LoadFacesAsync();
              }

              private async Task LoadPeopleAsync()
          ''',
          '''    protected override async Task OnInitializedAsync()
              {
                  State = Filters.Any(filter => filter.Value == State) ? State : "unreviewed";
                  Offset = Math.Max(0, Offset);
                  await LoadOptionsAsync();
                  ResolveModelSelection();
                  Sort = SortOptions.Any(option => option.Value == Sort) ? Sort : DefaultSort;
                  if (SelectedModel is null && Sort != DefaultSort)
                  {
                      Sort = DefaultSort;
                  }
                  await LoadPeopleAsync();
                  await LoadFacesAsync();
              }

              private async Task LoadOptionsAsync()
              {
                  Options = await Http.GetFromJsonAsync<ReviewFilterOptionsResponse>("api/review/filters")
                      ?? new ReviewFilterOptionsResponse([], []);
              }

              private void ResolveModelSelection()
              {
                  int index = -1;
                  if (!string.IsNullOrWhiteSpace(ModelId) && !string.IsNullOrWhiteSpace(ModelHash))
                  {
                      index = Options.ModelRevisions
                          .Select((model, modelIndex) => (model, modelIndex))
                          .FirstOrDefault(item =>
                              item.model.ModelId == ModelId &&
                              item.model.ModelHash == ModelHash)
                          .modelIndex;
                  }

                  if (index < 0 && Options.ModelRevisions.Count > 0)
                  {
                      index = 0;
                  }

                  SelectedModelIndex = index >= 0 ? index.ToString() : "";
                  ApplySelectedModel();
              }

              private void ApplySelectedModel()
