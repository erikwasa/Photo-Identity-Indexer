              [Fact]
              public async Task Gallery_returns_rank_one_suggestions_and_supports_stable_suggestion_sorts()
              {
                  string directory = CreateTemporaryDirectory();
                  try
                  {
                      string databasePath = Path.Combine(directory, "catalogue.db");
                      SqliteCatalogueDatabase database = new(databasePath);
                      await database.InitializeAsync();
                      SeededGallery seeded = await SeedGalleryAsync(database);

                      await using ReviewApiFactory factory = new(databasePath);
                      using HttpClient client = factory.CreateClient();
                      string modelScope = $"modelId=sface&modelHash={seeded.ModelHash}";

                      ReviewFacePageResponse filtered = Assert.IsType<ReviewFacePageResponse>(
                          await client.GetFromJsonAsync<ReviewFacePageResponse>(
                              $"/api/review/faces?state=unreviewed&{modelScope}&sort=created-desc"));
                      Assert.Equal(2, filtered.Total);

                      ReviewFacePageResponse byPerson = await GetPageAsync(
                          client,
                          modelScope,
                          "suggested-person");
                      Assert.Equal(
                          new[] { seeded.AdaFaceId, seeded.BobFaceId, seeded.NoSuggestionFaceId },
                          byPerson.Items.Select(face => face.Id).ToArray());
                      ReviewTopSuggestionResponse ada = Assert.IsType<ReviewTopSuggestionResponse>(
                          byPerson.Items[0].TopSuggestion);
                      Assert.Equal("Ada", ada.Person.DisplayName);
                      Assert.Equal(0.91, ada.Score, 6);
                      Assert.Equal(0.20, ada.ScoreMargin);
                      Assert.Equal("sface", ada.ModelId);
                      Assert.Equal(seeded.ModelHash, ada.ModelHash);
                      Assert.Null(byPerson.Items[2].TopSuggestion);

                      ReviewFacePageResponse easyFirst = await GetPageAsync(client, modelScope, "margin-desc");
                      Assert.Equal(
                          new[] { seeded.AdaFaceId, seeded.BobFaceId, seeded.NoSuggestionFaceId },
                          easyFirst.Items.Select(face => face.Id).ToArray());

                      ReviewFacePageResponse ambiguousFirst = await GetPageAsync(client, modelScope, "margin-asc");
                      Assert.Equal(
                          new[] { seeded.BobFaceId, seeded.AdaFaceId, seeded.NoSuggestionFaceId },
                          ambiguousFirst.Items.Select(face => face.Id).ToArray());

                      ReviewFacePageResponse scoreFirst = await GetPageAsync(client, modelScope, "score-desc");
                      Assert.Equal(
                          new[] { seeded.AdaFaceId, seeded.BobFaceId, seeded.NoSuggestionFaceId },
                          scoreFirst.Items.Select(face => face.Id).ToArray());

                      ReviewFacePageResponse missingFirst = await GetPageAsync(client, modelScope, "no-suggestion-first");
                      Assert.Equal(seeded.NoSuggestionFaceId, missingFirst.Items[0].Id);

                      string json = await client.GetStringAsync(
                          $"/api/review/faces?state=unreviewed&{modelScope}&includeWithoutSuggestion=true&sort=suggested-person");
                      Assert.DoesNotContain(seeded.SourceRoot, json, StringComparison.OrdinalIgnoreCase);
                  }
                  finally
                  {
                      DeleteTemporaryDirectory(directory);
                  }
              }

