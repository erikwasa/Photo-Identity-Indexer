name: wi0176-mobile-validation
on:
  push:
    branches: [agent/wi-0176-header-strip]
permissions:
  contents: write
jobs:
  mobile-layout-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual mobile capabilities and rotation
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/layout" playwright
          "$RUNNER_TEMP/layout/node_modules/.bin/playwright" install --with-deps chromium
          cat > "$RUNNER_TEMP/layout/check.cjs" <<'JS'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const path = 'src/PhotoIdentity.Web/Layout/MainLayout.razor.css';
            const fixed = fs.readFileSync(path, 'utf8');
            const old = cp.execFileSync('git', ['show', 'origin/main:' + path], {encoding:'utf8'});
            const global = fs.readFileSync('src/PhotoIdentity.Web/wwwroot/css/app.css', 'utf8');
            const markup = fs.readFileSync('src/PhotoIdentity.Web/Layout/MainLayout.razor', 'utf8')
              .replace(/^@inherits.*$/m, '').replace('@AppSurfaceNavigation.SlideshowsPath', '/slideshows').replace('@Body', '<section class="hero"><div><p>PERMANENT ARCHIVE</p><h1>Archive coverage</h1><p>Archive status</p></div></section>');
            const html = (css, size) => `<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${global}\n${css}\n:root{font-size:${size}px}</style>${markup}`;
            const mobile = await browser.newContext({isMobile:true,hasTouch:true,deviceScaleFactor:2.625,viewport:{width:915,height:412}});
            const page = await mobile.newPage();
            assert(await page.evaluate(()=>matchMedia('(hover: none) and (pointer: coarse)').matches));
            await page.setContent(html(old, 16));
            const baseline = await page.locator('.privacy-pill').evaluate(el=>getComputedStyle(el).display);
            console.log('Before fix phone landscape badge:',baseline);
            assert.notEqual(baseline,'none','Original landscape mobile mismatch must reproduce');
            let checks = 0;
            for (const size of [16,20]) {
              await page.setContent(html(fixed,size));
              for (const width of [412,915,1008,844,412]) {
                await page.setViewportSize({width,height:width>680?412:915});
                for (const open of [false,true]) {
                  await page.locator('details').evaluate((el,open)=>el.open=open,open);
                  const state = await page.evaluate(()=>({viewport:innerWidth,document:document.documentElement.scrollWidth,
                    badge:getComputedStyle(document.querySelector('.privacy-pill')).display,
                    position:getComputedStyle(document.querySelector('.topbar')).position,
                    header:document.querySelector('.topbar').getBoundingClientRect().toJSON(),
                    links:[...document.querySelectorAll('.primary-link,details[open] .advanced-menu-panel a')].map(el=>({text:el.textContent.trim(),left:el.getBoundingClientRect().left,right:el.getBoundingClientRect().right}))}));
                  assert.equal(state.badge,'none'); assert.equal(state.position,'static');
                  assert.equal(state.header.left,0); assert.equal(state.header.right,width);
                  assert(state.document<=width,'Document overflow');
                  for (const link of state.links) assert(link.left>=0&&link.right<=width,'Link outside viewport: '+link.text);
                  checks++; console.log(JSON.stringify({size,width,open,headerWidth:state.header.width,badge:state.badge}));
                }
              }
            }
            const desktop = await browser.newContext({viewport:{width:1280,height:800}});
            const desk = await desktop.newPage();
            await desk.setContent(html(fixed,16));
            for(const width of [740,900,1024,1280]) {
              await desk.setViewportSize({width,height:800});
              assert.equal(await desk.locator('.topbar').evaluate(el=>getComputedStyle(el).position),'sticky');
              assert.notEqual(await desk.locator('.privacy-pill').evaluate(el=>getComputedStyle(el).display),'none');
              assert(await desk.evaluate(()=>document.documentElement.scrollWidth<=innerWidth)); checks++;
            }
            console.log('Passed layout scenarios:',checks);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node "$RUNNER_TEMP/layout/check.cjs"
      - name: Record review and generate every delivery view
        shell: bash
        run: |
          dotnet run --project tools/PhotoIdentity.Docs -- show WI-0176
          dotnet run --project tools/PhotoIdentity.Docs -- review WI-0176
          dotnet run --project tools/PhotoIdentity.Docs -- generate
          dotnet run --project tools/PhotoIdentity.Docs -- validate
          dotnet run --project tools/PhotoIdentity.Docs -- generate --check
          rm .github/workflows/wi0176-mobile-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/delivery .github/workflows/wi0176-mobile-validation.yml
          git commit -m "Record WI-0176 mobile layout review and regenerate delivery views"
          git push
