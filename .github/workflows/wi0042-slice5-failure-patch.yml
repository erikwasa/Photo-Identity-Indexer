name: WI-0042 Slice 5 failure patch

on:
  push:
    branches:
      - agent/WI-0042-slice5-unattended-archive
    paths:
      - .github/workflows/wi0042-slice5-failure-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0042-slice5-unattended-archive
      - name: Patch bounded analysis failure propagation
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/PhotoIdentity.Api/ArchiveBoundedAnalysisService.cs")
          text = path.read_text(encoding="utf-8")
          old = '''                _ = await coordinator.ResumeAsync(\n                    latest.RunId,\n                    new ResumableBatchProcessorOptions(maxAttemptsPerInvocation: 1),\n                    cancellationToken);\n                _ = await TryAdvancePostAnalysisAsync('''
          new = '''                ArchiveAnalysisResumeResult resumed = await coordinator.ResumeAsync(\n                    latest.RunId,\n                    new ResumableBatchProcessorOptions(maxAttemptsPerInvocation: 1),\n                    cancellationToken);\n                if (resumed.ProcessingSummary.FailedJobs > 0)\n                {\n                    throw new InvalidOperationException(\n                        "Archive analysis failed for one or more images. Review the Archive failed filter before retrying.");\n                }\n\n                _ = await TryAdvancePostAnalysisAsync('''
          if old not in text:
              raise SystemExit("resume marker not found")
          text = text.replace(old, new, 1)

          old = '''        ArchiveAnalysisStartResult started = await coordinator.StartAsync(\n            analysisConfiguration,\n            new ResumableBatchProcessorOptions(maxAttemptsPerInvocation: 1),\n            cancellationToken);\n        _ = await TryAdvancePostAnalysisAsync('''
          new = '''        ArchiveAnalysisStartResult started = await coordinator.StartAsync(\n            analysisConfiguration,\n            new ResumableBatchProcessorOptions(maxAttemptsPerInvocation: 1),\n            cancellationToken);\n        if (started.ProcessingSummary?.FailedJobs > 0)\n        {\n            throw new InvalidOperationException(\n                "Archive analysis failed for one or more images. Review the Archive failed filter before retrying.");\n        }\n\n        _ = await TryAdvancePostAnalysisAsync('''
          if old not in text:
              raise SystemExit("start marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Erik Wahlström"
          git config user.email "54457926+erikwasa@users.noreply.github.com"
          git add src/PhotoIdentity.Api/ArchiveBoundedAnalysisService.cs
          git commit -m "Block unattended advancement on analysis failure"
          git push origin HEAD:agent/WI-0042-slice5-unattended-archive
