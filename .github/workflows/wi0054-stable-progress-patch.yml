name: WI-0054 stable archive progress patch

on:
  push:
    branches:
      - agent/WI-0054-stable-archive-progress
    paths:
      - .github/workflows/wi0054-stable-progress-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0054-stable-archive-progress
          fetch-depth: 0
      - name: Patch source verification identity semantics
        shell: bash
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("src/PhotoIdentity.Api/ArchiveSourceVerificationService.cs"); t=p.read_text(); o=base64.b64decode("").decode(); n=base64.b64decode("").decode(); assert t.count(o)==1; p.write_text(t.replace(o,n,1))'
          python -c 'from pathlib import Path; import base64; p=Path("src/PhotoIdentity.Api/ArchiveSourceVerificationService.cs"); t=p.read_text(); o=base64.b64decode("ICAgICAgICAgICAgcmV0dXJuIG5ldyBBcmNoaXZlU291cmNlVmVyaWZpY2F0aW9uQWR2YW5jZVJlc3VsdChmYWxzZSwgZmFsc2UsIGZhbHNlLCBudWxsLCBmYWxzZSwgZmFsc2UpOw==").decode(); n=base64.b64decode("ICAgICAgICAgICAgcmV0dXJuIG5ldyBBcmNoaXZlU291cmNlVmVyaWZpY2F0aW9uQWR2YW5jZVJlc3VsdCgKICAgICAgICAgICAgICAgIGZhbHNlLCBmYWxzZSwgZmFsc2UsIG51bGwsIG51bGwsIGZhbHNlLCBmYWxzZSwgZmFsc2UpOw==").decode(); assert t.count(o)==1; p.write_text(t.replace(o,n,1))'
          python -c 'from pathlib import Path; import base64; p=Path("src/PhotoIdentity.Api/ArchiveSourceVerificationService.cs"); t=p.read_text(); o=base64.b64decode("ICAgICAgICByZXR1cm4gbmV3IEFyY2hpdmVTb3VyY2VWZXJpZmljYXRpb25BZHZhbmNlUmVzdWx0KAogICAgICAgICAgICB0cnVlLAogICAgICAgICAgICBmYWxzZSwKICAgICAgICAgICAgdHJ1ZSwKICAgICAgICAgICAgcGVyc2lzdGVkLlJldmlzaW9uSWQsCiAgICAgICAgICAgIHBlcnNpc3RlZC5OZXdSZXZpc2lvbiwKICAgICAgICAgICAgdHJhbnNmZXJyZWQpOw==").decode(); n=base64.b64decode("").decode(); assert t.count(o)==1; p.write_text(t.replace(o,n,1))'
          python -c 'from pathlib import Path; import base64; p=Path("src/PhotoIdentity.Api/ArchiveSourceVerificationService.cs"); t=p.read_text(); o=base64.b64decode("ICAgIHByaXZhdGUgc3RhdGljIEFyY2hpdmVTb3VyY2VWZXJpZmljYXRpb25BZHZhbmNlUmVzdWx0IFdhaXRpbmcoKSA9PgogICAgICAgIG5ldyh0cnVlLCB0cnVlLCBmYWxzZSwgbnVsbCwgZmFsc2UsIGZhbHNlKTs=").decode(); n=base64.b64decode("ICAgIHByaXZhdGUgc3RhdGljIEFyY2hpdmVTb3VyY2VWZXJpZmljYXRpb25BZHZhbmNlUmVzdWx0IFdhaXRpbmcoKSA9PgogICAgICAgIG5ldyh0cnVlLCB0cnVlLCBmYWxzZSwgbnVsbCwgbnVsbCwgZmFsc2UsIGZhbHNlLCBmYWxzZSk7").decode(); assert t.count(o)==1; p.write_text(t.replace(o,n,1))'
      - name: Patch bounded analysis invalidation
        shell: bash
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("src/PhotoIdentity.Api/ArchiveBoundedAnalysisService.cs"); t=p.read_text(); o=base64.b64decode("").decode(); n=base64.b64decode("").decode(); assert t.count(o)==1; p.write_text(t.replace(o,n,1))'
      - name: Patch archive progress UI
        shell: bash
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("src/PhotoIdentity.Web/Pages/Archive.razor"); t=p.read_text(); o=base64.b64decode("").decode(); n=base64.b64decode("").decode(); assert t.count(o)==1; p.write_text(t.replace(o,n,1))'
      - name: Patch regression assertions and WI-0054 notes
        shell: bash
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("tests/PhotoIdentity.Integration.Tests/ArchiveSourceVerificationTests.cs"); t=p.read_text(); o=base64.b64decode("ICAgICAgICAgICAgQXNzZXJ0LlRydWUodmVyaWZpZWQuVmVyaWZpY2F0aW9uQ29tcGxldGVkKTsKICAgICAgICAgICAgQXNzZXJ0Lk5vdE51bGwodmVyaWZpZWQuUmV2aXNpb25JZCk7CiAgICAgICAgICAgIEFzc2VydC5UcnVlKHZlcmlmaWVkLk5ld1JldmlzaW9uKTsKICAgICAgICAgICAgQXNzZXJ0LlRydWUodmVyaWZpZWQuTWFuYWdlZEh5ZHJhdGlvblRyYW5zZmVycmVkKTs=").decode(); n=base64.b64decode("").decode(); assert t.count(o)==1; p.write_text(t.replace(o,n,1))'
          python -c 'from pathlib import Path; import base64; p=Path("docs/delivery/work-items/WI-0054-archive-ui-polish.md"); t=p.read_text(); o=base64.b64decode("My4gRXhwbGljaXQgb3JpZ2luYWwgaHlkcmF0aW9uIGlzIG9ic2VydmVkIGxpdmUgYnkgYC9vcmlnaW5hbC9zdGF0dXNgLCBidXQgQXJjaGl2ZSBjYW4gY29udGludWUgc2hvd2luZyB0aGUgcHJldmlvdXMgcGVyc2lzdGVkIGBvbmxpbmUtb25seWAgYXZhaWxhYmlsaXR5IHVudGlsIGFub3RoZXIgYXJjaGl2ZSBvcGVyYXRpb24gcmVjb3JkcyB0aGUgdHJhbnNpdGlvbi4KCiMjIEluIHNjb3Bl").decode(); n=base64.b64decode("").decode(); assert t.count(o)==1; p.write_text(t.replace(o,n,1))'
          python -c 'from pathlib import Path; import base64; p=Path("docs/delivery/work-items/WI-0054-archive-ui-polish.md"); t=p.read_text(); o=base64.b64decode("LSBbeF0gRnVsbCBidWlsZC90ZXN0L2RvY3MgdmVyaWZpY2F0aW9uIHJlbWFpbnMgZ3JlZW4uCgojIyBJbXBsZW1lbnRhdGlvbiBub3Rlcw==").decode(); n=base64.b64decode("").decode(); assert t.count(o)==1; p.write_text(t.replace(o,n,1))'
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/wi0054-stable-progress-patch.yml
          git config user.name "Erik Wahlström"
          git config user.email "54457926+erikwasa@users.noreply.github.com"
          git add src/PhotoIdentity.Api/ArchiveSourceVerificationService.cs src/PhotoIdentity.Api/ArchiveBoundedAnalysisService.cs src/PhotoIdentity.Web/Pages/Archive.razor tests/PhotoIdentity.Integration.Tests/ArchiveSourceVerificationTests.cs docs/delivery/work-items/WI-0054-archive-ui-polish.md
          git commit -m "Stabilize archive advancement progress"
          git push origin HEAD:agent/WI-0054-stable-archive-progress
