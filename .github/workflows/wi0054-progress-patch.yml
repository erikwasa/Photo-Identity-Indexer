name: WI-0054 progress patch

on:
  push:
    branches:
      - agent/WI-0054-archive-ui-polish
    paths:
      - .github/workflows/wi0054-progress-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0054-archive-ui-polish
          fetch-depth: 0
      - name: Clarify latest-run versus archive progress
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/PhotoIdentity.Web/Pages/Archive.razor')
          text = path.read_text(encoding='utf-8')
          if '<span>Progress</span>' not in text or '<span>Queued</span>' not in text:
              raise SystemExit('Expected Archive run labels were not found.')
          text = text.replace('<span>Progress</span>', '<span>Latest run progress</span>', 1)
          text = text.replace('<span>Queued</span>', '<span>Queued in latest run</span>', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/wi0054-progress-patch.yml
          git config user.name "Erik Wahlström"
          git config user.email "54457926+erikwasa@users.noreply.github.com"
          git add src/PhotoIdentity.Web/Pages/Archive.razor
          git commit -m "Clarify archive run progress"
          git push origin HEAD:agent/WI-0054-archive-ui-polish
