name: WI-0054 progress patch

on:
  push:
    branches:
      - agent/WI-0054-archive-ui-polish
    paths:
      - .github/workflows/wi0054-progress-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0054-archive-ui-polish
          fetch-depth: 0
      - name: Clarify latest-run versus archive progress
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/PhotoIdentity.Web/Pages/Archive.razor')
          text = path.read_text(encoding='utf-8')
          old = '''                <div>
                    <span>Progress</span>
                    <strong>@(run.SucceededJobs + run.FailedJobs + run.CancelledJobs) / @run.TotalJobs</strong>
                </div>
                <div>
                    <span>Queued</span>
                    <strong>@run.QueuedJobs</strong>
                </div>'''
          new = '''                <div>
                    <span>Latest run jobs</span>
                    <strong>@(run.SucceededJobs + run.FailedJobs + run.CancelledJobs) / @run.TotalJobs</strong>
                </div>
                <div>
                    <span>Archive analyzed</span>
                    <strong>@AnalysisCount(Status.Totals.AnalysedImages)</strong>
                </div>
                <div>
                    <span>Queued in latest run</span>
                    <strong>@run.QueuedJobs</strong>
                </div>'''
          if old not in text:
              raise SystemExit('Expected Archive progress block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/wi0054-progress-patch.yml
          git config user.name "Erik Wahlström"
          git config user.email "54457926+erikwasa@users.noreply.github.com"
          git add src/PhotoIdentity.Web/Pages/Archive.razor
          git commit -m "Clarify archive run progress"
          git push origin HEAD:agent/WI-0054-archive-ui-polish
