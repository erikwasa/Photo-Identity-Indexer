name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PhotoIdentity.slnx

      - name: Build
        id: build
        shell: pwsh
        run: |
          dotnet build PhotoIdentity.slnx --configuration Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          if-no-files-found: error
          retention-days: 1

      - name: Test
        run: dotnet test PhotoIdentity.slnx --configuration Release --no-build
