name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-pr-changes:
    runs-on: ubuntu-latest
    outputs:
      launcher: ${{ steps.changes.outputs.launcher }}
      package: ${{ steps.changes.outputs.package }}
    steps:
      - name: Classify deployment-surface changes
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('launcher', 'true');
              core.setOutput('package', 'true');
              core.info('Comprehensive main validation: launcher and package verification are enabled.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const paths = files.map(file => file.filename);
            const exact = new Set(paths);

            const sharedPublishSurface = paths.some(path => path.startsWith('src/')) ||
              exact.has('Directory.Build.props') ||
              exact.has('Directory.Packages.props') ||
              exact.has('PhotoIdentity.slnx') ||
              exact.has('.github/workflows/build.yml');

            const launcher = sharedPublishSurface ||
              exact.has('Start-PhotoIdentity.ps1') ||
              exact.has('Start-PhotoIdentity.cmd') ||
              exact.has('PhotoIdentity.launcher.example.json') ||
              exact.has('verify-launcher.ps1');

            const package = sharedPublishSurface || launcher ||
              paths.some(path => path.startsWith('packaging/windows/')) ||
              paths.some(path => path.startsWith('models/')) ||
              exact.has('Package-PhotoIdentity.ps1') ||
              exact.has('verify-package.ps1');

            core.setOutput('launcher', launcher ? 'true' : 'false');
            core.setOutput('package', package ? 'true' : 'false');
            core.info(`Changed files: ${paths.length}; launcher=${launcher}; package=${package}`);

  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore PhotoIdentity.slnx 2>&1 | Tee-Object -FilePath restore.log
          exit $LASTEXITCODE

      - name: Upload restore diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-diagnostics
          path: restore.log
          retention-days: 1

      - name: Build
        shell: pwsh
        run: |
          dotnet build PhotoIdentity.slnx --configuration Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          retention-days: 1

      - name: Test fast assemblies
        shell: pwsh
        run: |
          dotnet test PhotoIdentity.slnx --configuration Release --no-build --filter "FullyQualifiedName!~PhotoIdentity_Integration_Tests&FullyQualifiedName!~PhotoIdentity.Integration.Tests" 2>&1 | Tee-Object -FilePath fast-test.log
          exit $LASTEXITCODE

      # These tests exercise pure policy, persisted settings and argument
      # validation in the existing integration assembly, without starting
      # an HTTP host or touching private media.
      # Keep them separate from the host-heavy integration suite.
      - name: Verify WI-0189 quota policy and configuration
        shell: pwsh
        run: |
          dotnet test tests/PhotoIdentity.Integration.Tests/PhotoIdentity.Integration.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~VideoProxyRetentionPolicyTests|FullyQualifiedName~VideoProxyRetentionPreviewCommandTests|FullyQualifiedName~VideoProxyPublicationQuotaConfigurationTests|FullyQualifiedName~VideoProcessingQuotaPreferencesTests" 2>&1 | Tee-Object -FilePath wi0189-quota-tests.log
          exit $LASTEXITCODE

      - name: Upload WI-0189 focused test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wi0189-quota-test-diagnostics
          path: wi0189-quota-tests.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-diagnostics
          path: fast-test.log
          retention-days: 1
          if-no-files-found: warn

      - name: Install Python for offline image-quality evaluation tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test offline image-quality evaluation tools
        shell: pwsh
        run: |
          python -m unittest discover -s tools/PhotoIdentity.PhotoQualityEvaluation -p "test_*.py" -v
          exit $LASTEXITCODE

      - name: Parse offline quality-evaluation PowerShell runners
        shell: pwsh
        run: |
          $scripts = @(
            'tools/PhotoIdentity.PhotoQualityEvaluation/run_collection_shadow_simulation.ps1'
            'tools/PhotoIdentity.PhotoQualityEvaluation/run_bounded_collection_shadow.ps1'
            'tools/PhotoIdentity.PhotoQualityEvaluation/run_manual_quality_suggestions.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host "$script : $($_.Message)" }
              throw "PowerShell parser rejected $script"
            }
          }
          $runner = Get-Command './tools/PhotoIdentity.PhotoQualityEvaluation/run_bounded_collection_shadow.ps1'
          foreach ($required in @('Scenarios','BatchId','Score','AcceptResearchOnlyThirdPartyWeights','Review','NoOpen','Port')) {
            if (-not $runner.Parameters.ContainsKey($required)) {
              throw "Bounded research runner is missing -$required"
            }
          }
          $manual = Get-Command './tools/PhotoIdentity.PhotoQualityEvaluation/run_manual_quality_suggestions.ps1'
          foreach ($required in @('ScanLimit','SuggestionLimit','BatchId','Review','NoOpen','Port')) {
            if (-not $manual.Parameters.ContainsKey($required)) {
              throw "Manual quality suggestion runner is missing -$required"
            }
          }
          Write-Host 'Offline and manual-review runners parse and expose expected parameters.'

      - name: Run quarantined integration diagnostics
        id: flaky-integration-diagnostics
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/run-flaky-integration-diagnostics.ps1

      - name: Upload quarantined integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-integration-diagnostics
          path: .artifacts/flaky-integration-results
          retention-days: 3
          if-no-files-found: warn

      - name: Validate living documentation
        run: dotnet run --project tools/PhotoIdentity.Docs --configuration Release --no-build -- validate

      - name: Check generated documentation
        run: dotnet run --project tools/PhotoIdentity.Docs --configuration Release --no-build -- generate --check

      - name: Verify video survey metadata parsing
        shell: pwsh
        run: ./tools/verify-video-codec-survey.ps1

      - name: Run published review verification
        shell: powershell
        env:
          ASPNETCORE_ENVIRONMENT: IntegrationTest
        run: |
          $smokeProfile = if ("${{ github.event_name }}" -eq "pull_request") { "PublishedMinimum" } else { "Comprehensive" }
          ./verify-review.ps1 -Mode Smoke -SmokeProfile $smokeProfile -Configuration Release -SkipBuild -Port 5081

      - name: Upload review verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: review-verification-diagnostics
          path: |
            .artifacts/review-verification/verification-report.json
            .artifacts/review-verification/api.stdout.log
            .artifacts/review-verification/api.stderr.log
          retention-days: 1

      - name: Prepare Windows PowerShell verification fixtures
        shell: pwsh
        run: |
          $fixtureDirectory = Join-Path $PWD ".artifacts/ci-verification"
          New-Item -ItemType Directory -Path $fixtureDirectory -Force | Out-Null

          [IO.File]::WriteAllBytes(
            (Join-Path $fixtureDirectory "valid.png"),
            [Convert]::FromBase64String(
              "iVBORw0KGgoAAAANSUhEUgAAAAMAAAACCAIAAAASFvFNAAAAFUlEQVQIHWOUE+FiAANGOREuBjAAAAZyAHsISLb5AAAAAElFTkSuQmCC"))
          [IO.File]::WriteAllBytes(
            (Join-Path $fixtureDirectory "warning.jpg"),
            [Convert]::FromBase64String(
              ""))
          [IO.File]::WriteAllBytes(
            (Join-Path $fixtureDirectory "corrupt.jpg"),
            [byte[]](0xff, 0xd8, 0xff, 0xd9))
          [IO.File]::WriteAllBytes(
            (Join-Path $fixtureDirectory "unsupported.gif"),
            [Text.Encoding]::ASCII.GetBytes("GIF89a"))

      - name: Run Windows PowerShell mixed-media verification
        id: mixed-verification
        continue-on-error: true
        shell: powershell
        run: |
          ./verify-local.ps1 `
            -Configuration Release `
            -SkipBuild `
            -SkipTests `
            -SkipDocumentation `
            -SkipModels `
            -Image @(
              ".artifacts/ci-verification/valid.png"
              ".artifacts/ci-verification/warning.jpg"
              ".artifacts/ci-verification/corrupt.jpg"
            ) `
            -UnsupportedImage ".artifacts/ci-verification/unsupported.gif"

      - name: Assert Windows PowerShell verification report
        shell: pwsh
        env:
          VERIFICATION_OUTCOME: ${{ steps.mixed-verification.outcome }}
        run: |
          if ($env:VERIFICATION_OUTCOME -ne "failure") {
            throw "Expected the mixed valid/warning/corrupt verification step to fail."
          }

          $report = Get-Content ".artifacts/local-verification/verification-report.json" -Raw | ConvertFrom-Json
          if ($report.result -ne "failed") {
            throw "Expected aggregate result 'failed'."
          }

          if ($report.decoderChecks.Count -ne 3) {
            throw "Expected all three decoder checks to be retained in the report."
          }

          if ($report.decoderChecks[0].result -ne "passed") {
            throw "Expected the valid PNG check to pass."
          }

          if ($report.decoderChecks[1].result -ne "passed") {
            throw "Expected the warning-producing JPEG check to pass."
          }

          if ($report.decoderChecks[2].failure -ne "corrupt_media") {
            throw "Expected the corrupt JPEG check to be classified as corrupt_media."
          }

          if ($report.unsupportedChecks.Count -ne 1 -or $report.unsupportedChecks[0].result -ne "passed") {
            throw "Expected the unsupported GIF check to pass."
          }

          $allChecks = @($report.decoderChecks) + @($report.unsupportedChecks)
          if (@($allChecks | Where-Object { -not $_.inputUnchanged }).Count -ne 0) {
            throw "Expected every fixture input to remain unchanged."
          }

      - name: Upload local verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-verification-diagnostics
          path: .artifacts/local-verification/verification-report.json
          retention-days: 1

  integration-tests:
    name: integration-shard-${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore integration project
        run: dotnet restore tests/PhotoIdentity.Integration.Tests/PhotoIdentity.Integration.Tests.csproj

      - name: Build integration project
        run: dotnet build tests/PhotoIdentity.Integration.Tests/PhotoIdentity.Integration.Tests.csproj --configuration Release --no-restore

      - name: Test integration shard
        shell: pwsh
        run: ./.github/scripts/run-integration-shards.ps1 -ShardCount 2 -ShardNumber ${{ matrix.shard }}

      - name: Summarize integration shard timings
        if: always()
        shell: pwsh
        run: ./.github/scripts/summarize-test-timings.ps1

      - name: Upload integration shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-shard-${{ matrix.shard }}-evidence
          path: |
            .artifacts/test-results
            .artifacts/test-shards
            .artifacts/test-timings
          retention-days: 3
          if-no-files-found: warn

  launcher-verification:
    needs: classify-pr-changes
    if: github.event_name != 'pull_request' || needs.classify-pr-changes.outputs.launcher == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore launcher host
        run: dotnet restore src/PhotoIdentity.Api/PhotoIdentity.Api.csproj

      - name: Build launcher host
        run: dotnet build src/PhotoIdentity.Api/PhotoIdentity.Api.csproj --configuration Release --no-restore

      - name: Start PostgreSQL for launcher verification
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql-x64-*' | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $service) {
            throw "The Windows runner does not provide a PostgreSQL service."
          }
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -U postgres photoidentity_launcher_verification
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run Windows launcher verification
        shell: powershell
        env:
          PHOTOIDENTITY_LAUNCHER_VERIFICATION_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=photoidentity_launcher_verification;Username=postgres;Password=root
        run: ./verify-launcher.ps1 -Configuration Release -Port 5082

      - name: Upload launcher verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-verification-diagnostics
          path: .artifacts/launcher-verification
          retention-days: 1

  package-verification:
    needs: classify-pr-changes
    if: github.event_name != 'pull_request' || needs.classify-pr-changes.outputs.package == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start PostgreSQL for package verification
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql-x64-*' | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $service) {
            throw "The Windows runner does not provide a PostgreSQL service."
          }
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -U postgres photoidentity_package_verification
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify PostgreSQL persistence and video derivative maintenance
        shell: pwsh
        env:
          PHOTOIDENTITY_TEST_POSTGRES_ADMIN_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=root
        run: |
          # Match verify-postgres.ps1. The video maintenance/janitor fixtures also
          # create disposable databases but do not have 'Postgres' in their names.
          dotnet test tests/PhotoIdentity.Persistence.Tests/PhotoIdentity.Persistence.Tests.csproj --configuration Release --filter "FullyQualifiedName~Postgres|FullyQualifiedName~VideoRegisteredDerivativeMaintenanceTests|FullyQualifiedName~VideoDerivativeRecoveryJanitorTests|FullyQualifiedName~VideoScopedOneShotControlTests|FullyQualifiedName~VideoDerivativePublicationTests"
          exit $LASTEXITCODE

      - name: Run Windows package verification
        shell: powershell
        env:
          PHOTOIDENTITY_PACKAGE_VERIFICATION_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=photoidentity_package_verification;Username=postgres;Password=root
        run: ./verify-package.ps1 -Configuration Release -Port 5083

      - name: Upload Windows operator package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photoidentity-win-x64-package
          path: .artifacts/package-verification/packages/PhotoIdentity-win-x64.zip
          retention-days: 3

      - name: Upload package verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-verification-diagnostics
          path: |
            .artifacts/package-verification/localappdata/PhotoIdentity/launcher-logs
            .artifacts/package-verification/packages/PhotoIdentity-win-x64/package-manifest.json
          retention-days: 1
