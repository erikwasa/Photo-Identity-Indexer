name: WI-0042 refresh status registry

on:
  push:
    branches:
      - agent/WI-0042-source-reverification

permissions:
  contents: write

jobs:
  refresh-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0042-source-reverification
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Refresh canonical WI-0042 active branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'docs/delivery/status/work-items.yaml'
          $text = [IO.File]::ReadAllText($path)
          $pattern = '(?ms)(- id: WI-0042\r?\n.*?\r?\n  last_updated_at: )\d{4}-\d{2}-\d{2}(\r?\n  branch: )[^\r\n]+'
          $replacement = '${1}2026-08-09${2}agent/WI-0042-source-reverification'
          $updated = [Text.RegularExpressions.Regex]::Replace($text, $pattern, $replacement, 1)
          if ($updated -eq $text) { throw 'WI-0042 status block was not updated.' }
          [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))
          dotnet run --project tools/PhotoIdentity.Docs -- generate
          if ($LASTEXITCODE -ne 0) { throw "documentation generation failed with exit code $LASTEXITCODE" }
          dotnet run --project tools/PhotoIdentity.Docs -- validate
          if ($LASTEXITCODE -ne 0) { throw "documentation validation failed with exit code $LASTEXITCODE" }
      - name: Commit status refresh and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/wi0042-refresh-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/delivery
          git commit -m "Refresh WI-0042 Slice 4 status"
          git push origin HEAD:agent/WI-0042-source-reverification
