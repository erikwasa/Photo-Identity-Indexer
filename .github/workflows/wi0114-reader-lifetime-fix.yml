name: WI-0114 reader lifetime corrective patch

on:
  push:
    branches:
      - agent/WI-0114-list-groups-reader-fix

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/WI-0114-list-groups-reader-fix
          persist-credentials: true

      - name: Apply Npgsql reader lifetime fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/PhotoIdentity.Persistence.Postgres/PostgresProvisionalFaceClusterRepository.cs")
          text = path.read_text(encoding="utf-8")

          old_refresh = '''            await using NpgsqlDataReader reader = await command.ExecuteReaderAsync(cancellationToken);\n            while (await reader.ReadAsync(cancellationToken))\n            {\n                currentRuns.Add(ReadRun(reader));\n            }\n\n            await transaction.CommitAsync(cancellationToken);'''
          new_refresh = '''            await using (NpgsqlDataReader reader = await command.ExecuteReaderAsync(cancellationToken))\n            {\n                while (await reader.ReadAsync(cancellationToken))\n                {\n                    currentRuns.Add(ReadRun(reader));\n                }\n            }\n\n            await transaction.CommitAsync(cancellationToken);'''

          old_groups = '''        List<ProvisionalFaceClusterGroupSummary> result = [];\n        await using NpgsqlDataReader reader = await command.ExecuteReaderAsync(cancellationToken);\n        while (await reader.ReadAsync(cancellationToken))\n        {\n            result.Add(new(\n                reader.GetGuid(0),\n                reader.GetString(1),\n                reader.GetInt32(2),\n                reader.GetInt32(3),\n                reader.GetInt32(4)));\n        }\n\n        await transaction.CommitAsync(cancellationToken);'''
          new_groups = '''        List<ProvisionalFaceClusterGroupSummary> result = [];\n        await using (NpgsqlDataReader reader = await command.ExecuteReaderAsync(cancellationToken))\n        {\n            while (await reader.ReadAsync(cancellationToken))\n            {\n                result.Add(new(\n                    reader.GetGuid(0),\n                    reader.GetString(1),\n                    reader.GetInt32(2),\n                    reader.GetInt32(3),\n                    reader.GetInt32(4)));\n            }\n        }\n\n        await transaction.CommitAsync(cancellationToken);'''

          for old, new, label in [
              (old_refresh, new_refresh, "TryStartNextRefreshAsync"),
              (old_groups, new_groups, "ListCurrentGroupsAsync"),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one {label} reader lifetime pattern.")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

      - name: Commit focused fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wi0114-reader-lifetime-fix.yml
          git add src/PhotoIdentity.Persistence.Postgres/PostgresProvisionalFaceClusterRepository.cs
          git commit -m "Fix WI-0114 Npgsql reader lifetimes"
          git push origin HEAD:agent/WI-0114-list-groups-reader-fix
