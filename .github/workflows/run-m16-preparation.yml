name: Run M16 planning preparation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/M16-detector-recall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute preparation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/prepare-m16-detector-recall.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          block = lines[start:end]
          non_empty = [line for line in block if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in non_empty)
          source = '\n'.join(line[indent:] for line in block) + '\n'
          exec(compile(source, str(workflow), 'exec'))
          PY

      - name: Commit planning documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Planning documents are already current."
            exit 0
          fi
          git commit -m "Add detector recall milestone and gates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
