name: WI-0042 wire bounded analysis

on:
  push:
    branches:
      - agent/WI-0042-bounded-hydration

permissions:
  contents: write

jobs:
  wire-endpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0042-bounded-hydration
          fetch-depth: 0
      - name: Replace archive analysis step implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/PhotoIdentity.Api/ArchiveEndpoints.cs'
          $text = [System.IO.File]::ReadAllText($path)
          $startMarker = '    private static async Task<IResult> AnalysisStepAsync('
          $endMarker = '    private static async Task<ArchiveStatusResponse> BuildStatusAsync('
          $start = $text.IndexOf($startMarker, [System.StringComparison]::Ordinal)
          $end = $text.IndexOf($endMarker, [System.StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -le $start) { throw 'Archive analysis method markers were not found.' }
          $replacement = @'
              private static async Task<IResult> AnalysisStepAsync(
                  SqliteCatalogueDatabase database,
                  ArchiveOperatorConfiguration operatorConfiguration,
                  ArchiveBoundedAnalysisService boundedAnalysis,
                  CancellationToken cancellationToken)
              {
                  try
                  {
                      ArchiveBoundedAnalysisAdvanceResult advanced = await boundedAnalysis.AdvanceAsync(
                          operatorConfiguration,
                          cancellationToken);
                      return Results.Ok(new ArchiveAnalysisStepResponse(
                          advanced.StartedNewRun,
                          await BuildStatusAsync(database, operatorConfiguration, cancellationToken)));
                  }
                  catch (Exception exception)
                  {
                      return BadRequest(exception);
                  }
              }

          '@
          $replacement = $replacement -replace '(?m)^ {12}', ''
          $updated = $text.Substring(0, $start) + $replacement + $text.Substring($end)
          [System.IO.File]::WriteAllText($path, $updated, [System.Text.UTF8Encoding]::new($false))
      - name: Commit endpoint wiring and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/wi0042-wire-bounded-analysis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PhotoIdentity.Api/ArchiveEndpoints.cs
          git commit -m "Use bounded hydration for archive analysis steps"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:agent/WI-0042-bounded-hydration
          if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE" }
