name: WI-0042 Slice 5 clarity patch

on:
  push:
    branches:
      - agent/WI-0042-slice5-unattended-archive
    paths:
      - .github/workflows/wi0042-slice5-clarity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0042-slice5-unattended-archive
      - name: Patch summary semantics and wording
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          status = "src/PhotoIdentity.Persistence.Sqlite/SqliteArchiveStatusRepository.cs"
          replace_once(
              status,
              '''                SUM(CASE WHEN current.deleted_at_utc IS NULL\n                              AND current.verification_state = 'verified'\n                              AND current.availability = 'local'\n                              AND current.revision_id IS NOT NULL\n                              AND analysis.asset_revision_id IS NULL\n                              AND COALESCE(latest_job.status, '') <> 'failed'\n                         THEN 1 ELSE 0 END),''',
              '''                SUM(CASE WHEN current.deleted_at_utc IS NULL\n                              AND current.verification_state = 'verified'\n                              AND current.revision_id IS NOT NULL\n                              AND analysis.asset_revision_id IS NULL\n                              AND COALESCE(latest_job.status, '') <> 'failed'\n                         THEN 1 ELSE 0 END),''')
          replace_once(
              status,
              '''                SUM(CASE WHEN current.deleted_at_utc IS NULL\n                              AND current.verification_state = 'verified'\n                              AND current.availability = 'local'\n                              AND current.revision_id IS NOT NULL\n                              AND analysis.asset_revision_id IS NULL\n                              AND latest_job.status = 'failed'\n                         THEN 1 ELSE 0 END),''',
              '''                SUM(CASE WHEN current.deleted_at_utc IS NULL\n                              AND current.verification_state = 'verified'\n                              AND current.revision_id IS NOT NULL\n                              AND analysis.asset_revision_id IS NULL\n                              AND latest_job.status = 'failed'\n                         THEN 1 ELSE 0 END),''')

          archive = "src/PhotoIdentity.Web/Pages/Archive.razor"
          replace_once(
              archive,
              '''            OneDrive placeholders are catalogued without opening their content. Use Advance archive to request only the verification or analysis hydration that is needed; Photo Identity applies the configured storage budget and releases only content it hydrated.''',
              '''            OneDrive placeholders are catalogued without opening their content. Advance archive synchronizes coverage and continues unattended through verification, bounded hydration, analysis, proxy generation and managed release. Photo Identity releases only content it hydrated.''')
          replace_once(
              archive,
              '''                <p class="eyebrow">Governed profile</p>\n                <h2 id="archive-analysis-heading">Archive analysis</h2>''',
              '''                <p class="eyebrow">Unattended processing</p>\n                <h2 id="archive-analysis-heading">Archive advancement</h2>\n                <p>Start once and leave it running. The server waits for OneDrive transitions and continues until the selected coverage is complete, paused or blocked.</p>''')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Erik Wahlström"
          git config user.email "54457926+erikwasa@users.noreply.github.com"
          git add src/PhotoIdentity.Persistence.Sqlite/SqliteArchiveStatusRepository.cs src/PhotoIdentity.Web/Pages/Archive.razor
          git commit -m "Make archive analysis status independent of availability"
          git push origin HEAD:agent/WI-0042-slice5-unattended-archive
