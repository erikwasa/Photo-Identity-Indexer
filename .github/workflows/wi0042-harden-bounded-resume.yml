name: WI-0042 harden bounded resume

on:
  push:
    branches:
      - agent/WI-0042-bounded-hydration

permissions:
  contents: write

jobs:
  patch-resume:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0042-bounded-hydration
          fetch-depth: 0
      - name: Patch bounded resume preparation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/PhotoIdentity.Api/ArchiveBoundedAnalysisService.cs'
          $text = [System.IO.File]::ReadAllText($path)
          $old = @'
              if (!durable.IsTerminal)
              {
                  _ = await coordinator.ResumeAsync(
          '@
          $new = @'
              if (!durable.IsTerminal)
              {
                  if (!await EnsureNextDueJobReadyAsync(latest.RunId, cancellationToken))
                  {
                      return new ArchiveBoundedAnalysisAdvanceResult(false);
                  }

                  _ = await coordinator.ResumeAsync(
          '@
          if (-not $text.Contains($old)) { throw 'Resume insertion marker was not found.' }
          $text = $text.Replace($old, $new)

          $marker = '    private async Task PreparePendingRevisionAsync('
          $index = $text.IndexOf($marker, [System.StringComparison]::Ordinal)
          if ($index -lt 0) { throw 'PreparePendingRevisionAsync marker was not found.' }
          $helper = @'
              private async Task<bool> EnsureNextDueJobReadyAsync(
                  ProcessingRunId runId,
                  CancellationToken cancellationToken)
              {
                  IReadOnlyList<CatalogueProcessingJob> jobs = await new SqliteProcessingRepository(_database)
                      .GetJobsAsync(runId, cancellationToken);
                  DateTimeOffset now = _timeProvider.GetUtcNow();
                  CatalogueProcessingJob? next = jobs
                      .Where(job => job.Status == ProcessingJobStatus.Queued && job.AvailableAtUtc <= now)
                      .OrderBy(job => job.AvailableAtUtc)
                      .ThenBy(job => job.Id.ToString(), StringComparer.Ordinal)
                      .FirstOrDefault();
                  if (next is null)
                  {
                      return true;
                  }

                  CollectionOriginalAccessSnapshot? status = await _originals.GetStatusAsync(
                      next.AssetRevisionId,
                      cancellationToken);
                  if (status?.State == CollectionOriginalAccessService.ReadyState)
                  {
                      await RecordAvailabilityAsync(next.AssetRevisionId, AssetAvailability.Local, cancellationToken);
                      return true;
                  }

                  await PreparePendingRevisionAsync(next.AssetRevisionId, cancellationToken);
                  return false;
              }

          '@
          $helper = $helper -replace '(?m)^ {12}', ''
          $text = $text.Insert($index, $helper)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
      - name: Commit hardening and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/wi0042-harden-bounded-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PhotoIdentity.Api/ArchiveBoundedAnalysisService.cs
          git commit -m "Hydrate queued archive jobs before resume"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:agent/WI-0042-bounded-hydration
          if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE" }
