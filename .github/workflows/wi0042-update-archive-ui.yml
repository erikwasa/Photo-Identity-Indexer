name: WI-0042 update archive UI

on:
  push:
    branches:
      - agent/WI-0042-source-reverification

permissions:
  contents: write

jobs:
  update-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0042-source-reverification
          fetch-depth: 0
      - name: Update archive operator UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/PhotoIdentity.Web/Pages/Archive.razor'
          $text = [IO.File]::ReadAllText($path)

          function Replace-Exact([string]$old, [string]$new) {
            if (-not $script:text.Contains($old)) { throw "Archive UI marker not found: $($old.Substring(0, [Math]::Min(80, $old.Length)))" }
            $script:text = $script:text.Replace($old, $new)
          }

          Replace-Exact '        <p>Add recursive folders under one stable source root, synchronize changed files and OneDrive availability, and analyze only locally available revisions that still need the governed CenterFace/SFace profile.</p>' '        <p>Add recursive folders under one stable source root, synchronize lightweight OneDrive observations, verify changed or first-time online-only sources under the bounded storage policy, and analyze exact immutable revisions with the governed CenterFace/SFace profile.</p>'

          Replace-Exact @'
              <article class="@(Status.Totals.FailedImages > 0 ? "attention" : null)">
                  <span>Failed</span>
                  <strong>@AnalysisCount(Status.Totals.FailedImages)</strong>
              </article>
          '@ @'
              <article class="@(Status.Totals.NeedsSourceVerificationImages > 0 ? "attention" : null)">
                  <span>Needs verification</span>
                  <strong>@Status.Totals.NeedsSourceVerificationImages</strong>
              </article>
              <article class="@(Status.Totals.UnverifiedSourceImages > 0 ? "attention" : null)">
                  <span>First verification</span>
                  <strong>@Status.Totals.UnverifiedSourceImages</strong>
              </article>
              <article class="@(Status.Totals.FailedImages > 0 ? "attention" : null)">
                  <span>Failed</span>
                  <strong>@AnalysisCount(Status.Totals.FailedImages)</strong>
              </article>
          '@

          Replace-Exact @'
          @if (Status.Totals.OnlineOnlyImages + Status.Totals.DownloadingImages > 0)
          {
              <div class="notice warning">
                  OneDrive placeholders are catalogued but not opened. Hydrate them with the OneDrive sync client, then sync again before analysis.
              </div>
          }
          '@ @'
          @if (Status.Totals.OnlineOnlyImages + Status.Totals.DownloadingImages > 0)
          {
              <div class="notice warning">
                  OneDrive placeholders are catalogued without opening their content. Use Advance archive to request only the verification or analysis hydration that is needed; Photo Identity applies the configured storage budget and releases only content it hydrated.
              </div>
          }
          '@

          Replace-Exact @'
              <button class="button primary" disabled="@(Busy || !Status.Configured || !Status.AnalysisReady || Status.Totals.PendingImages == 0)" @onclick="AnalyzePendingAsync">
                  @(Analyzing ? "Analyzing…" : Status.LatestRun is { QueuedJobs: > 0 } ? "Continue analysis" : "Analyze pending")
              </button>
          '@ @'
              <button class="button primary" disabled="@(Busy || !Status.Configured || !Status.AnalysisReady)" @onclick="AnalyzePendingAsync">
                  @(Analyzing ? "Advancing…" : "Advance archive")
              </button>
          '@

          Replace-Exact '                            <th>Failed</th>`r`n                            <th>Missing</th>' '                            <th>Failed</th>`r`n                            <th>Verify</th>`r`n                            <th>Missing</th>'
          Replace-Exact '                                <td class="@(folder.FailedImages > 0 ? "failure-count" : null)">@AnalysisCount(folder.FailedImages)</td>`r`n                                <td>@folder.MissingImages</td>' '                                <td class="@(folder.FailedImages > 0 ? "failure-count" : null)">@AnalysisCount(folder.FailedImages)</td>`r`n                                <td class="@(folder.NeedsSourceVerificationImages + folder.UnverifiedSourceImages > 0 ? "failure-count" : null)">@(folder.NeedsSourceVerificationImages + folder.UnverifiedSourceImages)</td>`r`n                                <td>@folder.MissingImages</td>'

          Replace-Exact '                    <option value="failed">Processing failed</option>`r`n                    <option value="unavailable">Not local</option>' '                    <option value="failed">Processing failed</option>`r`n                    <option value="needs-source-verification">Needs source verification</option>`r`n                    <option value="unverified">First source verification</option>`r`n                    <option value="unavailable">Not local</option>'

          Replace-Exact '                            <th>Availability</th>`r`n                            <th>Analysis</th>' '                            <th>Availability</th>`r`n                            <th>Source verification</th>`r`n                            <th>Analysis</th>'
          Replace-Exact '                                <td><span class="archive-state state-@CssToken(item.Availability)">@AvailabilityLabel(item.Availability)</span></td>`r`n                                <td><span class="archive-state state-@CssToken(item.AnalysisState)">@AnalysisStateLabel(item.AnalysisState)</span></td>' '                                <td><span class="archive-state state-@CssToken(item.Availability)">@AvailabilityLabel(item.Availability)</span></td>`r`n                                <td><span class="archive-state state-@CssToken(item.SourceVerificationState)">@SourceVerificationLabel(item.SourceVerificationState)</span></td>`r`n                                <td><span class="archive-state state-@CssToken(item.AnalysisState)">@AnalysisStateLabel(item.AnalysisState)</span></td>'

          Replace-Exact '            Message = $"Sync complete: {result.NewRevisions} new revision(s), {result.UnchangedFiles} unchanged local, {result.OnlineOnlyFiles} online-only, {result.DownloadingFiles} downloading, {result.AvailabilityErrors + result.UnavailableFiles} availability issue(s), {result.MarkedMissing} marked missing.";' '            Message = $"Sync complete: {result.NewRevisions} new revision(s), {result.UnchangedFiles} unchanged local, {result.NeedsSourceVerification} needing re-verification, {result.UnverifiedSources} awaiting first verification, {result.OnlineOnlyFiles} online-only, {result.DownloadingFiles} downloading, {result.AvailabilityErrors + result.UnavailableFiles} availability issue(s), {result.MarkedMissing} marked missing.";'

          Replace-Exact @'
                  Message = Status?.Totals.PendingImages == 0
                      ? "Archive analysis is up to date for locally available images in the current profile."
                      : "Archive analysis stopped with pending work remaining. Review failures or continue the run.";
          '@ @'
                  int sourceVerification = (Status?.Totals.NeedsSourceVerificationImages ?? 0) + (Status?.Totals.UnverifiedSourceImages ?? 0);
                  Message = sourceVerification > 0
                      ? "Archive advancement is waiting for authoritative source verification. If OneDrive is downloading, use Advance archive again after the file becomes local."
                      : Status?.Totals.PendingImages == 0
                          ? "This archive step completed. Advance archive is safe to run again; it will also retry any durable post-analysis proxy work."
                          : "Archive advancement stopped with pending work remaining. Review failures or advance again.";
          '@

          Replace-Exact @'
              "unavailable" => "Not local",
              "missing" => "Missing",
          '@ @'
              "unavailable" => "Not local",
              "needs-source-verification" => "Needs source verification",
              "unverified" => "First source verification",
              "missing" => "Missing",
          '@

          $marker = '    private static string AnalysisStateLabel(string state) => state switch'
          $insert = @'
              private static string SourceVerificationLabel(string state) => state switch
              {
                  "verified" => "Verified",
                  "needs-source-verification" => "Needs verification",
                  "unverified" => "First verification",
                  _ => state,
              };

          '@ -replace '(?m)^ {12}', ''
          $idx = $text.IndexOf($marker, [StringComparison]::Ordinal)
          if ($idx -lt 0) { throw 'AnalysisStateLabel marker not found.' }
          $text = $text.Insert($idx, $insert)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
      - name: Commit UI update and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/wi0042-update-archive-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PhotoIdentity.Web/Pages/Archive.razor
          git commit -m "Expose source verification in archive UI"
          git push origin HEAD:agent/WI-0042-source-reverification
