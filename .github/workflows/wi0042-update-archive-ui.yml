name: WI-0042 update archive UI

on:
  push:
    branches:
      - agent/WI-0042-source-reverification

permissions:
  contents: write

jobs:
  update-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0042-source-reverification
          fetch-depth: 0
      - name: Update archive operator UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/PhotoIdentity.Web/Pages/Archive.razor'
          $text = [IO.File]::ReadAllText($path)

          function Replace-Required([string]$old, [string]$new) {
            if (-not $script:text.Contains($old)) { throw "Archive UI marker not found: $old" }
            $script:text = $script:text.Replace($old, $new)
          }

          Replace-Required 'Add recursive folders under one stable source root, synchronize changed files and OneDrive availability, and analyze only locally available revisions that still need the governed CenterFace/SFace profile.' 'Add recursive folders under one stable source root, synchronize lightweight OneDrive observations, verify changed or first-time online-only sources under the bounded storage policy, and analyze exact immutable revisions with the governed CenterFace/SFace profile.'
          Replace-Required 'OneDrive placeholders are catalogued but not opened. Hydrate them with the OneDrive sync client, then sync again before analysis.' 'OneDrive placeholders are catalogued without opening their content. Use Advance archive to request only the verification or analysis hydration that is needed; Photo Identity applies the configured storage budget and releases only content it hydrated.'
          Replace-Required 'disabled="@(Busy || !Status.Configured || !Status.AnalysisReady || Status.Totals.PendingImages == 0)" @onclick="AnalyzePendingAsync"' 'disabled="@(Busy || !Status.Configured || !Status.AnalysisReady)" @onclick="AnalyzePendingAsync"'
          Replace-Required '@(Analyzing ? "Analyzing…" : Status.LatestRun is { QueuedJobs: > 0 } ? "Continue analysis" : "Analyze pending")' '@(Analyzing ? "Advancing…" : "Advance archive")'
          Replace-Required 'Sync complete: {result.NewRevisions} new revision(s), {result.UnchangedFiles} unchanged local, {result.OnlineOnlyFiles} online-only, {result.DownloadingFiles} downloading, {result.AvailabilityErrors + result.UnavailableFiles} availability issue(s), {result.MarkedMissing} marked missing.' 'Sync complete: {result.NewRevisions} new revision(s), {result.UnchangedFiles} unchanged local, {result.NeedsSourceVerification} needing re-verification, {result.UnverifiedSources} awaiting first verification, {result.OnlineOnlyFiles} online-only, {result.DownloadingFiles} downloading, {result.AvailabilityErrors + result.UnavailableFiles} availability issue(s), {result.MarkedMissing} marked missing.'
          Replace-Required 'Archive analysis is up to date for locally available images in the current profile.' 'This archive step completed. If source verification or OneDrive downloading is still shown, use Advance archive again after content becomes local; the same action also retries durable proxy work.'
          Replace-Required 'Archive analysis stopped with pending work remaining. Review failures or continue the run.' 'Archive advancement stopped with pending work remaining. Review failures or use Advance archive again.'

          $failedCard = '        <article class="@(Status.Totals.FailedImages > 0 ? "attention" : null)">'
          $verificationCards = @'
                  <article class="@(Status.Totals.NeedsSourceVerificationImages > 0 ? "attention" : null)">
                      <span>Needs verification</span>
                      <strong>@Status.Totals.NeedsSourceVerificationImages</strong>
                  </article>
                  <article class="@(Status.Totals.UnverifiedSourceImages > 0 ? "attention" : null)">
                      <span>First verification</span>
                      <strong>@Status.Totals.UnverifiedSourceImages</strong>
                  </article>
          '@ -replace '(?m)^ {12}', ''
          Replace-Required $failedCard ($verificationCards + $failedCard)

          Replace-Required '                            <th>Failed</th>' "                            <th>Failed</th>`r`n                            <th>Verify</th>"
          Replace-Required '                                <td class="@(folder.FailedImages > 0 ? "failure-count" : null)">@AnalysisCount(folder.FailedImages)</td>' "                                <td class=`"@(folder.FailedImages > 0 ? `"failure-count`" : null)`">@AnalysisCount(folder.FailedImages)</td>`r`n                                <td class=`"@(folder.NeedsSourceVerificationImages + folder.UnverifiedSourceImages > 0 ? `"failure-count`" : null)`">@(folder.NeedsSourceVerificationImages + folder.UnverifiedSourceImages)</td>"
          Replace-Required '                    <option value="failed">Processing failed</option>' "                    <option value=`"failed`">Processing failed</option>`r`n                    <option value=`"needs-source-verification`">Needs source verification</option>`r`n                    <option value=`"unverified`">First source verification</option>"
          Replace-Required '                            <th>Availability</th>' "                            <th>Availability</th>`r`n                            <th>Source verification</th>"
          Replace-Required '                                <td><span class="archive-state state-@CssToken(item.Availability)">@AvailabilityLabel(item.Availability)</span></td>' "                                <td><span class=`"archive-state state-@CssToken(item.Availability)`">@AvailabilityLabel(item.Availability)</span></td>`r`n                                <td><span class=`"archive-state state-@CssToken(item.SourceVerificationState)`">@SourceVerificationLabel(item.SourceVerificationState)</span></td>"

          Replace-Required '        "unavailable" => "Not local",' "        `"unavailable`" => `"Not local`",`r`n        `"needs-source-verification`" => `"Needs source verification`",`r`n        `"unverified`" => `"First source verification`","

          $marker = '    private static string AnalysisStateLabel(string state) => state switch'
          if (-not $text.Contains($marker)) { throw 'AnalysisStateLabel marker not found.' }
          $helper = @'
              private static string SourceVerificationLabel(string state) => state switch
              {
                  "verified" => "Verified",
                  "needs-source-verification" => "Needs verification",
                  "unverified" => "First verification",
                  _ => state,
              };

          '@ -replace '(?m)^ {12}', ''
          $text = $text.Replace($marker, $helper + $marker)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
      - name: Commit UI update and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/wi0042-update-archive-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PhotoIdentity.Web/Pages/Archive.razor
          git commit -m "Expose source verification in archive UI"
          git push origin HEAD:agent/WI-0042-source-reverification
