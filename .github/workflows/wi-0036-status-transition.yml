name: Apply WI-0036 status transition

on:
  push:
    branches:
      - agent/WI-0036-multiscale-yunet
    paths:
      - .github/workflows/wi-0036-status-transition.yml

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0036-multiscale-yunet
          fetch-depth: 0

      - name: Update canonical registry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/delivery/status/work-items.yaml')
          text = path.read_text(encoding='utf-8')

          old_35 = '''  - id: WI-0035
              title: Tune YuNet confidence threshold
              milestone: M16
              status: in_progress
              owner: human-maintainer
              document: ../work-items/WI-0035-yunet-threshold-sweep.md
              started_at: '2026-08-05'
              last_updated_at: '2026-08-05'
              blockers:
                - WI-0039
              evidence:
                - type: human_verification
                  value: PR #74 completed reusable candidate-run matching and activated the fixed 0.8, 0.7, 0.6 and 0.5 YuNet threshold sweep; confidence 0.8 was the first candidate.
                - type: human_verification
                  value: The maintainer completed review of the isolated confidence-0.8 candidate on 2026-08-05. It failed the complete M16 gate; detailed metrics and category evidence remain private, and confidence 0.7 is the next governed candidate.
          '''
          new_35 = '''  - id: WI-0035
              title: Tune YuNet confidence threshold
              milestone: M16
              status: completed
              owner: human-maintainer
              document: ../work-items/WI-0035-yunet-threshold-sweep.md
              started_at: '2026-08-05'
              completed_at: '2026-08-06'
              verified_at: '2026-08-06'
              verified_by: human
              last_updated_at: '2026-08-06'
              blockers:
                - WI-0039
              evidence:
                - type: human_verification
                  value: "PR #74 completed reusable candidate-run matching and activated the fixed 0.8, 0.7, 0.6 and 0.5 YuNet threshold sweep."
                - type: human_verification
                  value: The maintainer completed isolated comparison runs for confidence 0.8, 0.7, 0.6 and 0.5 against the immutable confidence-0.9 ground truth by 2026-08-06. Every governed threshold from 0.9 through 0.5 failed the complete M16 gate; detailed metrics and category evidence remain private, and threshold tuning is insufficient.
          '''

          old_36 = '''  - id: WI-0036
              title: Add multi-scale YuNet detection
              milestone: M16
              status: proposed
              owner: unassigned
              document: ../work-items/WI-0036-multiscale-yunet.md
              blockers:
                - WI-0035
              evidence: []
          '''
          new_36 = '''  - id: WI-0036
              title: Add multi-scale YuNet detection
              milestone: M16
              status: in_progress
              owner: ai-agent
              document: ../work-items/WI-0036-multiscale-yunet.md
              started_at: '2026-08-06'
              last_updated_at: '2026-08-06'
              branch: agent/WI-0036-multiscale-yunet
              blockers:
                - WI-0035
              evidence:
                - type: human_verification
                  value: The completed confidence sweep established that threshold tuning alone is insufficient, activating governed multi-scale YuNet work on 2026-08-06.
                - type: pull_request
                  value: https://github.com/erikwasa/Photo-Identity-Indexer/pull/82
          '''

          old_38 = '''  - id: WI-0038
              title: Roll out the selected detector pipeline
              milestone: M16
              status: proposed
              owner: unassigned
              document: ../work-items/WI-0038-detector-rollout.md
              blockers:
                - WI-0035
              evidence: []
          '''
          new_38 = '''  - id: WI-0038
              title: Roll out the selected detector pipeline
              milestone: M16
              status: proposed
              owner: unassigned
              document: ../work-items/WI-0038-detector-rollout.md
              blockers:
                - WI-0036
              evidence: []
          '''

          for label, old, new in (
              ('WI-0035', old_35, new_35),
              ('WI-0036', old_36, new_36),
              ('WI-0038', old_38, new_38),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one canonical {label} block, found {text.count(old)}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8', newline='\n')
          Path('.github/workflows/wi-0036-status-transition.yml').unlink()
          PY

      - name: Commit registry transition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/delivery/status/work-items.yaml .github/workflows/wi-0036-status-transition.yml
          git commit -m "Update status registry for WI-0036"
          git push origin HEAD:agent/WI-0036-multiscale-yunet
