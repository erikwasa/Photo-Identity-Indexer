name: WI-0042 start

on:
  push:
    branches:
      - agent/WI-0042-explicit-original-hydration

permissions:
  contents: write

jobs:
  start-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/WI-0042-explicit-original-hydration
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Start WI-0042 through documentation tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tools/PhotoIdentity.Docs -- start WI-0042 --owner ai-agent --branch agent/WI-0042-explicit-original-hydration
          if ($LASTEXITCODE -ne 0) { throw "PhotoIdentity.Docs start failed with exit code $LASTEXITCODE" }
          dotnet run --project tools/PhotoIdentity.Docs -- validate
          if ($LASTEXITCODE -ne 0) { throw "PhotoIdentity.Docs validate failed with exit code $LASTEXITCODE" }
          dotnet run --project tools/PhotoIdentity.Docs -- generate --check
          if ($LASTEXITCODE -ne 0) { throw "PhotoIdentity.Docs generate --check failed with exit code $LASTEXITCODE" }
      - name: Commit started status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/wi0042-start.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/delivery/status/work-items.yaml docs/delivery/status/milestones.yaml docs/delivery/status/current.md docs/delivery/roadmap.md
          git commit -m "Start WI-0042 explicit original hydration"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed with exit code $LASTEXITCODE" }
          git push origin HEAD:agent/WI-0042-explicit-original-hydration
          if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE" }
