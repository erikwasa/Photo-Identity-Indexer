name: issue461-docs
on:
  push:
    branches: [agent/issue-461-landscape-verification]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate and check all delivery views
        shell: pwsh
        run: |
          dotnet run --project tools/PhotoIdentity.Docs -- generate
          dotnet run --project tools/PhotoIdentity.Docs -- validate
          dotnet run --project tools/PhotoIdentity.Docs -- generate --check
          Remove-Item .github/workflows/issue461-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/delivery .github/workflows/issue461-docs.yml
          git commit -m "Include regenerated roadmap after accepted work-item completion"
          git push
